<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>角色圖片預覽</title>
    <style>
      :root {
        color: #3b2d22;
        background: #fff6dd;
        font-family:
          "Noto Sans TC",
          "Microsoft JhengHei",
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          linear-gradient(180deg, rgba(255, 246, 221, 0.94), rgba(255, 250, 235, 0.98)),
          #fff6dd;
      }

      main {
        width: min(100%, 1120px);
        margin: 0 auto;
        padding: 22px clamp(14px, 3vw, 28px) 40px;
      }

      header {
        display: grid;
        gap: 10px;
        margin-bottom: 18px;
      }

      h1 {
        margin: 0;
        color: #9d3e28;
        font-size: clamp(1.7rem, 5vw, 2.5rem);
        line-height: 1.1;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        color: #705746;
        font-size: 1rem;
        line-height: 1.6;
      }

      .toolbar,
      .species-tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        margin: 18px 0;
      }

      .pill,
      .species-tab {
        border: 1px solid #f0c98b;
        border-radius: 999px;
        background: #fff;
        color: #775035;
        padding: 8px 12px;
        font-weight: 800;
      }

      .species-tab {
        cursor: pointer;
      }

      .species-tab.active {
        border-color: #df5b41;
        color: #9d3e28;
        box-shadow: 0 0 0 2px rgba(223, 91, 65, 0.16);
      }

      .preview-layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(280px, 360px);
        gap: 18px;
        align-items: start;
      }

      .character-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
      }

      .character-card,
      .detail-panel {
        border: 1px solid #f0cf9b;
        border-radius: 8px;
        background: #fffaf0;
        box-shadow: 0 10px 24px rgba(93, 64, 37, 0.1);
      }

      .character-card {
        display: grid;
        gap: 8px;
        padding: 10px;
        color: inherit;
        text-align: center;
        cursor: pointer;
      }

      .character-card.active {
        outline: 3px solid #df5b41;
      }

      .character-card img,
      .detail-panel img {
        width: 100%;
        display: block;
        border-radius: 8px;
        background: #fbefd0;
      }

      .character-card strong {
        color: #5f3925;
        font-size: 1rem;
      }

      .character-card small {
        color: #8a6a53;
        font-weight: 700;
        line-height: 1.35;
      }

      .detail-panel {
        position: sticky;
        top: 14px;
        padding: 14px;
      }

      .detail-panel h2 {
        margin: 12px 0 4px;
        color: #9d3e28;
        font-size: 1.6rem;
        letter-spacing: 0;
      }

      .detail-panel dl {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        gap: 8px 10px;
        margin: 14px 0 0;
        color: #705746;
      }

      .detail-panel dt {
        font-weight: 900;
      }

      .detail-panel dd {
        margin: 0;
      }

      @media (max-width: 780px) {
        .preview-layout {
          grid-template-columns: 1fr;
        }

        .detail-panel {
          position: static;
          order: -1;
        }
      }

      @media (max-width: 520px) {
        main {
          padding-inline: 10px;
        }

        .character-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 10px;
        }

        .character-card {
          padding: 8px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>收藏角色圖片預覽</h1>
        <p>這裡是美術審核用頁面，不會改變正式 app 的轉蛋、金幣、星星或收藏進度。</p>
      </header>

      <div class="toolbar" aria-label="角色資訊">
        <span class="pill">地上的生物</span>
        <span class="pill" id="speciesNamePill">貓家族</span>
        <span class="pill">9 個角色</span>
      </div>

      <div class="species-tabs" id="speciesTabs" aria-label="切換家族"></div>

      <section class="preview-layout">
        <div class="character-grid" id="characterGrid" aria-label="角色圖片預覽"></div>
        <aside class="detail-panel" aria-live="polite">
          <img id="detailImage" alt="" />
          <h2 id="detailTitle"></h2>
          <p id="detailDescription"></p>
          <dl>
            <dt>物種</dt>
            <dd id="detailSpecies"></dd>
            <dt>用途</dt>
            <dd>角色收藏、轉蛋結果、角色個人頁</dd>
            <dt>狀態</dt>
            <dd>已接入正式收藏角色資產</dd>
          </dl>
        </aside>
      </section>
    </main>

    <script>
      const pageBase = window.location.pathname.includes("/character-recognition-dojo/")
        ? "/character-recognition-dojo/"
        : "/";

      const speciesData = {

        },

            ["dog-mother.webp", "狗媽媽", "親切的狗媽媽，有薰衣草外套和溫暖圍裙。"],
            ["dog-older-brother.webp", "狗哥哥", "活潑的狗哥哥，有珊瑚色帽子、藍色上衣和背包。"],
            ["dog-older-sister.webp", "狗姐姐", "開朗的狗姐姐，有薄荷色蝴蝶結和小包包。"],
            ["dog-younger-brother.webp", "狗弟弟", "小小的狗弟弟，穿綠色吊帶褲，拿著玩具車。"],
            ["dog-younger-sister.webp", "狗妹妹", "可愛的狗妹妹，穿藍色裙子和黃色蝴蝶結。"],
            ["dog-baby.webp", "狗寶寶", "最小的狗寶寶，坐著穿薄荷色小圍兜。"],
          ],
        },
        rabbit: {
          label: "兔家族",

          characters: [
            ["rabbit-grandpa.webp", "兔爺爺", "溫和的兔爺爺，有小眼鏡、圍巾和折好的報紙。"],

            ["rabbit-mother.webp", "兔媽媽", "親切的兔媽媽，拿著小澆水壺照顧花。"],
            ["rabbit-older-brother.webp", "兔哥哥", "活潑的兔哥哥，有運動帽、球和運動服。"],
            ["rabbit-older-sister.webp", "兔姐姐", "開朗的兔姐姐，有花髮夾和小洋娃娃。"],
            ["rabbit-younger-brother.webp", "兔弟弟", "小小的兔弟弟，穿吊帶褲，拿著機器人玩具。"],
            ["rabbit-younger-sister.webp", "兔妹妹", "可愛的兔妹妹，有小背包和圖畫書。"],
            ["rabbit-baby.webp", "兔寶寶", "最小的兔寶寶，坐著拿固齒器和小毯子。"],
          ],
        },
        bear: {
          label: "熊家族",
          species: "熊",
          basePath: `${pageBase}assets/characters/land/bear/`,
          characters: [
            ["bear-grandpa.webp", "熊爺爺", "溫和的熊爺爺，有小眼鏡、茶杯和小書。"],
            ["bear-grandma.webp", "熊奶奶", "溫柔的熊奶奶，有小眼鏡和毛線籃。"],
            ["bear-father.webp", "熊爸爸", "穩重的熊爸爸，穿白襯衫，拿著小工具箱。"],
            ["bear-mother.webp", "熊媽媽", "親切的熊媽媽，有托特包和溫暖圍裙。"],
            ["bear-older-brother.webp", "熊哥哥", "活潑的熊哥哥，穿橘色連身褲，帶著小相機。"],
            ["bear-older-sister.webp", "熊姐姐", "開朗的熊姐姐，有花髮夾和小花籃。"],
            ["bear-younger-brother.webp", "熊弟弟", "小小的熊弟弟，穿吊帶褲，拿著玩具飛機。"],
            ["bear-younger-sister.webp", "熊妹妹", "可愛的熊妹妹，有小斜背包和蝴蝶結。"],
            ["bear-baby.webp", "熊寶寶", "最小的熊寶寶，坐著拿小搖鈴。"],
          ],
        },
        deer: {
          label: "鹿家族",
          species: "鹿",
          basePath: `${pageBase}assets/characters/land/deer/`,

            ["deer-grandpa.webp", "鹿爺爺", "溫和的鹿爺爺，有小眼鏡、背心和折好的報紙。"],

            ["deer-father.webp", "鹿爸爸", "穩重的鹿爸爸，穿暖色背心，拿著折好的地圖。"],
            ["deer-mother.webp", "鹿媽媽", "親切的鹿媽媽，有澆水壺和柔和圍裙。"],
            ["deer-older-brother.webp", "鹿哥哥", "活潑的鹿哥哥，有橘色背包、球和運動服。"],
            ["deer-older-sister.webp", "鹿姐姐", "開朗的鹿姐姐，有花髮夾和圖畫書。"],
            ["deer-younger-brother.webp", "鹿弟弟", "小小的鹿弟弟，拿著紅色玩具火車。"],
            ["deer-younger-sister.webp", "鹿妹妹", "可愛的鹿妹妹，有薄荷背包和蜜桃蝴蝶結。"],
            ["deer-baby.webp", "鹿寶寶", "最小的鹿寶寶，坐著拿小搖鈴。"],
          ],
        },
        fox: {
          label: "狐狸家族",
          species: "狐狸",
          basePath: `${pageBase}assets/characters/land/fox/`,
          characters: [
            ["fox-grandpa.webp", "狐狸爺爺", "溫和的狐狸爺爺，有小眼鏡、藍色外套和小書。"],
            ["fox-grandma.webp", "狐狸奶奶", "溫柔的狐狸奶奶，有小眼鏡、茶杯和毛線袋。"],
            ["fox-father.webp", "狐狸爸爸", "穩重的狐狸爸爸，有小側背包和杯子。"],
            ["fox-mother.webp", "狐狸媽媽", "親切的狐狸媽媽，有托特包和圖畫書。"],
            ["fox-older-brother.webp", "狐狸哥哥", "活潑的狐狸哥哥，有小相機、背包和探險背心。"],
            ["fox-older-sister.webp", "狐狸姐姐", "開朗的狐狸姐姐，有小洋娃娃和藍色花髮夾。"],
            ["fox-younger-brother.webp", "狐狸弟弟", "小小的狐狸弟弟，拿著機器人玩具。"],
            ["fox-younger-sister.webp", "狐狸妹妹", "可愛的狐狸妹妹，有黃色小包包和薄荷蝴蝶結。"],
            ["fox-baby.webp", "狐狸寶寶", "最小的狐狸寶寶，坐著拿固齒器和小毯子。"],
          ],
        },
      };

      const speciesTabs = document.querySelector("#speciesTabs");
      const speciesNamePill = document.querySelector("#speciesNamePill");
      const grid = document.querySelector("#characterGrid");
      const detailImage = document.querySelector("#detailImage");
      const detailTitle = document.querySelector("#detailTitle");
      const detailDescription = document.querySelector("#detailDescription");
      const detailSpecies = document.querySelector("#detailSpecies");
      let activeSpeciesId = new URLSearchParams(window.location.search).get("species") || "cat";
      let activeCharacterIndex = 0;

      function selectCharacter(index) {
        const data = speciesData[activeSpeciesId];
        const [fileName, title, description] = data.characters[index];
        activeCharacterIndex = index;
        detailImage.src = `${data.basePath}${fileName}`;
        detailTitle.textContent = title;
        detailDescription.textContent = description;
        detailSpecies.textContent = data.species;
        document.querySelectorAll(".character-card").forEach((button, buttonIndex) => {
          button.classList.toggle("active", buttonIndex === index);
        });
      }

      function renderSpecies(speciesId) {
        activeSpeciesId = speciesData[speciesId] ? speciesId : "cat";
        activeCharacterIndex = 0;
        const data = speciesData[activeSpeciesId];
        speciesNamePill.textContent = data.label;
        grid.replaceChildren();
        data.characters.forEach(([fileName, title, description], index) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "character-card";
          button.addEventListener("click", () => selectCharacter(index));

          const image = document.createElement("img");
          image.src = `${data.basePath}${fileName}`;
          image.alt = "";

          const name = document.createElement("strong");
          name.textContent = title;

          const note = document.createElement("small");
          note.textContent = description;

          button.append(image, name, note);
          grid.append(button);
        });
        document.querySelectorAll(".species-tab").forEach((button) => {
          button.classList.toggle("active", button.dataset.speciesId === activeSpeciesId);
        });
        selectCharacter(activeCharacterIndex);
      }

      Object.entries(speciesData).forEach(([speciesId, data]) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "species-tab";
        button.dataset.speciesId = speciesId;
        button.textContent = data.label;
        button.addEventListener("click", () => renderSpecies(speciesId));
        speciesTabs.append(button);
      });

      renderSpecies(activeSpeciesId);
    </script>
  </body>
</html>
