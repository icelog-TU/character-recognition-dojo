<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>認字練功房｜下一課規劃工具</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #25211d;
        --muted: #6f6861;
        --line: #ddd5ca;
        --paper: #fffaf1;
        --panel: #fffdf8;
        --soft: #f5ead9;
        --primary: #19796f;
        --primary-soft: #e3f3ef;
        --accent: #f05545;
        --accent-soft: #ffe4df;
        --gold: #e8a926;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        line-height: 1.55;
      }

      button,
      input,
      textarea,
      select {
        font: inherit;
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 5;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px clamp(14px, 4vw, 28px);
        background: #ff6506;
        color: #fff;
        box-shadow: 0 8px 24px rgba(117, 65, 12, 0.18);
      }

      .brand {
        display: grid;
        gap: 2px;
      }

      .brand strong {
        font-size: clamp(1.1rem, 4vw, 1.55rem);
        line-height: 1.1;
      }

      .brand span {
        font-size: 0.86rem;
        opacity: 0.9;
      }

      .header-actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 8px;
      }

      .page {
        width: min(1120px, 100%);
        margin: 0 auto;
        padding: clamp(14px, 4vw, 28px);
      }

      .panel,
      .choice-card,
      .request-panel {
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--panel);
        box-shadow: 0 12px 28px rgba(74, 55, 32, 0.08);
      }

      .panel {
        padding: clamp(16px, 4vw, 24px);
        margin-bottom: 16px;
      }

      .summary-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
      }

      .metric {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 12px;
        background: #fff;
      }

      .metric strong {
        display: block;
        font-size: clamp(1.3rem, 5vw, 2rem);
        line-height: 1.1;
      }

      .metric span {
        color: var(--muted);
        font-size: 0.9rem;
      }

      .learned {
        margin-top: 12px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .learned span {
        min-width: 34px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        padding: 4px 8px;
        text-align: center;
        font-weight: 800;
      }

      .plan-slot-controls {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .plan-slot {
        display: grid;
        gap: 4px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #fff;
        padding: 12px;
        cursor: pointer;
      }

      .plan-slot input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }

      .plan-slot:has(input:checked) {
        border-color: var(--primary);
        background: var(--primary-soft);
        box-shadow: 0 0 0 4px rgba(25, 121, 111, 0.1);
      }

      .plan-slot strong {
        font-size: 1.05rem;
      }

      .plan-slot span {
        color: var(--muted);
        font-size: 0.9rem;
      }

      .dependency-note {
        margin-top: 10px;
        border: 1px solid rgba(25, 121, 111, 0.22);
        border-radius: 10px;
        background: #eefaf5;
        padding: 10px;
        color: var(--muted);
        font-weight: 700;
      }

      .manual-choice-panel {
        margin-top: 14px;
        border-top: 1px solid var(--line);
        padding-top: 14px;
      }

      .manual-grid {
        display: grid;
        grid-template-columns: 0.7fr 1fr 2fr auto;
        gap: 8px;
        align-items: end;
        margin-top: 10px;
      }

      .manual-field {
        display: grid;
        gap: 4px;
      }

      .manual-field label {
        color: var(--muted);
        font-size: 0.86rem;
        font-weight: 800;
      }

      .manual-field input {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #fff;
        color: var(--ink);
        padding: 10px;
      }

      .choice-list {
        display: grid;
        gap: 14px;
      }

      .choice-card {
        padding: clamp(14px, 3vw, 20px);
      }

      .choice-card.selected {
        border-color: var(--primary);
        box-shadow: 0 0 0 5px rgba(25, 121, 111, 0.12), 0 12px 28px rgba(25, 121, 111, 0.14);
        scroll-margin-top: 116px;
      }

      .choice-card.previewing {
        border-color: rgba(25, 121, 111, 0.48);
        box-shadow: 0 0 0 4px rgba(25, 121, 111, 0.08), 0 12px 28px rgba(74, 55, 32, 0.08);
        scroll-margin-top: 116px;
      }

      .choice-card.selected::before {
        content: "目前正在編輯這個候選字";
        display: inline-flex;
        margin-bottom: 10px;
        border-radius: 999px;
        background: var(--primary-soft);
        color: var(--primary);
        padding: 4px 10px;
        font-size: 0.88rem;
        font-weight: 850;
      }

      .choice-card.compact .sentence-list,
      .choice-card.compact .custom-section,
      .choice-card.previewing:not(.selected) .custom-section,
      .choice-card.previewing:not(.selected) .sentence-row > input[type="checkbox"],
      .choice-card.previewing:not(.selected) .candidate-tools,
      .choice-card.previewing:not(.selected) .note-input {
        display: none;
      }

      .choice-card.previewing:not(.selected) .sentence-row {
        grid-template-columns: 1fr;
      }

      .choice-head {
        display: grid;
        grid-template-columns: auto 1fr auto;
        align-items: center;
        gap: 12px;
      }

      .choice-actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 8px;
      }

      .char-badge {
        display: grid;
        place-items: center;
        width: 58px;
        height: 58px;
        border-radius: 12px;
        background: var(--primary-soft);
        color: var(--primary);
        font-size: 2.2rem;
        font-weight: 900;
      }

      .choice-head h2 {
        margin: 0;
        font-size: 1.25rem;
      }

      .choice-head p,
      .sentence-row p,
      .help {
        margin: 4px 0 0;
        color: var(--muted);
      }

      .sentence-list {
        display: grid;
        gap: 8px;
        margin-top: 14px;
      }

      .selection-meter {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        margin-top: 14px;
        border: 2px solid rgba(25, 121, 111, 0.22);
        border-radius: 12px;
        background: #eefaf5;
        padding: 10px 12px;
      }

      .selection-meter strong {
        color: var(--primary);
        font-size: 1.18rem;
      }

      .selection-meter span {
        color: var(--muted);
        font-weight: 750;
      }

      .selection-meter.warning {
        border-color: rgba(240, 85, 69, 0.35);
        background: var(--accent-soft);
      }

      .review-coverage {
        display: grid;
        gap: 8px;
        margin-top: 10px;
        border: 2px solid rgba(232, 169, 38, 0.35);
        border-radius: 12px;
        background: #fff8e6;
        padding: 10px 12px;
      }

      .review-coverage strong {
        font-size: 1rem;
      }

      .review-count-list {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .review-count {
        display: inline-flex;
        align-items: baseline;
        gap: 4px;
        border: 1px solid rgba(232, 169, 38, 0.42);
        border-radius: 999px;
        background: #fffdf8;
        padding: 4px 10px;
        font-weight: 850;
      }

      .review-count.zero {
        color: var(--muted);
      }

      .review-count span {
        color: var(--primary);
        font-size: 1.12rem;
      }

      .optimizer-summary {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 10px;
      }

      .optimizer-pill {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        border: 1px solid rgba(25, 121, 111, 0.22);
        border-radius: 999px;
        background: #eefaf5;
        color: var(--primary);
        padding: 4px 10px;
        font-weight: 850;
      }

      .optimizer-pill.warning {
        border-color: rgba(240, 85, 69, 0.32);
        background: var(--accent-soft);
        color: #a43c31;
      }

      .optimizer-pill.pending {
        border-color: rgba(232, 169, 38, 0.42);
        background: #fff8ec;
        color: #8a5b10;
      }

      .custom-section {
        margin-top: 14px;
        border-top: 1px solid var(--line);
        padding-top: 14px;
      }

      .custom-section h3 {
        margin: 0;
        font-size: 1.05rem;
      }

      .ai-settings-panel .help,
      .manual-choice-panel .help {
        margin-bottom: 12px;
      }

      .ai-grid {
        display: grid;
        grid-template-columns: 1.8fr 1fr auto;
        gap: 10px;
        align-items: end;
      }

      .ai-field {
        display: grid;
        gap: 6px;
      }

      .ai-field label {
        color: var(--muted);
        font-size: 0.9rem;
        font-weight: 800;
      }

      .ai-field input {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px;
        font: inherit;
      }

      .ai-status {
        margin-top: 10px;
        color: var(--muted);
        font-size: 0.95rem;
      }

      .draft-box {
        margin-top: 12px;
        border: 2px dashed #c9bca9;
        border-radius: 12px;
        background: #fff8ec;
        padding: 12px;
      }

      .draft-box h4,
      .added-list h4 {
        margin: 0 0 8px;
        font-size: 1rem;
      }

      .sentence-row {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 10px;
        align-items: start;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #fff;
        padding: 10px;
      }

      .sentence-row.checked {
        border-color: rgba(25, 121, 111, 0.42);
        background: #f0fbf6;
      }

      .sentence-row.preview-only {
        grid-template-columns: 1fr;
      }

      .sentence-row > input[type="checkbox"] {
        width: 22px;
        height: 22px;
        margin-top: 4px;
        accent-color: var(--primary);
      }

      .sentence-text {
        font-size: 1.22rem;
        font-weight: 850;
      }

      .sentence-row.edited {
        border-color: rgba(25, 121, 111, 0.32);
        background: #f0fbf6;
      }

      .candidate-tools {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 10px;
      }

      .candidate-original {
        margin-top: 8px;
        color: var(--muted);
        font-size: 0.92rem;
      }

      .candidate-edit-panel {
        margin-top: 10px;
        border: 2px dashed #b7d9d2;
        border-radius: 10px;
        background: #f8fffc;
        padding: 10px;
      }

      .sentence-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 6px;
        color: var(--muted);
        font-size: 0.9rem;
      }

      .pill {
        border-radius: 999px;
        background: var(--soft);
        padding: 2px 8px;
      }

      .custom-grid {
        display: grid;
        grid-template-columns: 1fr 1fr 0.4fr;
        gap: 8px;
        margin-top: 12px;
      }

      .custom-section {
        margin-top: 12px;
      }

      .custom-section h3 {
        margin-bottom: 6px;
      }

      .custom-section + .sentence-list {
        margin-top: 14px;
      }

      .candidate-edit-grid {
        display: grid;
        grid-template-columns: 1fr 1fr 0.4fr;
        gap: 8px;
        margin-top: 10px;
      }

      .candidate-edit-grid input {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #fff;
        color: var(--ink);
        padding: 10px;
      }

      .custom-grid input,
      .note-input,
      textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #fff;
        color: var(--ink);
        padding: 10px;
      }

      .note-input {
        min-height: 64px;
        resize: vertical;
        font-family: inherit;
        font-size: 1rem;
      }

      .custom-grid .note-input {
        grid-column: 1 / -1;
      }

      .custom-tools {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        margin-top: 10px;
      }

      .custom-feedback {
        color: var(--primary);
        font-weight: 850;
      }

      .added-list {
        display: grid;
        gap: 8px;
        margin-top: 12px;
      }

      .added-row {
        border: 2px solid rgba(25, 121, 111, 0.26);
        border-radius: 10px;
        background: #f0fbf6;
        padding: 12px;
      }

      .added-row-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 8px;
      }

      .added-sentence {
        font-size: 1.28rem;
        font-weight: 900;
      }

      .added-notes {
        margin-top: 8px;
        color: var(--muted);
      }

      .edit-fields {
        display: none;
        margin-top: 10px;
      }

      .added-row.editing .edit-fields {
        display: grid;
      }

      .request-actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-start;
        gap: 8px;
        margin-top: 10px;
      }

      .nearby-request-panel {
        margin-top: 14px;
        border: 2px solid rgba(25, 121, 111, 0.22);
        border-radius: 12px;
        background: #eefaf5;
        padding: 12px;
      }

      .nearby-request-panel h4 {
        margin: 0;
        font-size: 1rem;
      }

      .request-panel {
        margin-top: 16px;
        padding: clamp(14px, 3vw, 20px);
      }

      textarea {
        min-height: 240px;
        resize: vertical;
        font-family: Consolas, "SFMono-Regular", monospace;
        font-size: 0.88rem;
      }

      .btn {
        min-height: 42px;
        border: 0;
        border-radius: 999px;
        background: var(--primary);
        color: #fff;
        padding: 9px 14px;
        font-weight: 850;
        cursor: pointer;
      }

      .btn.secondary {
        border: 1px solid var(--line);
        background: #fff;
        color: var(--ink);
      }

      .btn.danger {
        background: var(--accent);
      }

      .btn:disabled {
        cursor: not-allowed;
        opacity: 0.5;
      }

      .status {
        margin-top: 10px;
        color: var(--primary);
        font-weight: 800;
      }

      @media (max-width: 760px) {
        .summary-grid,
        .custom-grid,
        .candidate-edit-grid,
        .manual-grid,
        .ai-grid,
        .plan-slot-controls {
          grid-template-columns: 1fr;
        }

        .choice-head {
          grid-template-columns: auto 1fr;
        }

        .choice-actions {
          grid-column: 1 / -1;
          justify-content: stretch;
        }

        .choice-actions .btn {
          flex: 1 1 0;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <strong>下一課規劃工具</strong>
        <span>認字練功房｜教師用入口</span>
      </div>
      <div class="header-actions">
        <button class="btn secondary" id="refreshBtn" type="button">重新整理推薦</button>
        <button class="btn secondary" id="aiRecommendBtn" type="button">AI 重新推薦新字</button>
        <a class="btn secondary" href="../">回幼兒 APP</a>
      </div>
    </header>

    <main class="page">
      <section class="panel" id="summaryPanel">
        <p class="help">正在讀取教材資料。</p>
      </section>

      <section class="panel" id="planSlotPanel"></section>

      <section class="panel manual-choice-panel" aria-labelledby="manualChoiceTitle">
        <h2 id="manualChoiceTitle">自選下一課字</h2>
        <p class="help">候選清單沒有你想教的字時，可以自己加入。加入後到候選字卡片按「AI 生成 10 句」，再在 Planner 裡審核、修改和查看複習字統計。</p>
        <div class="manual-grid">
          <div class="manual-field">
            <label for="manualChar">新字</label>
            <input id="manualChar" maxlength="2" inputmode="text" placeholder="輸入一個字" />
          </div>
          <div class="manual-field">
            <label for="manualZhuyin">注音</label>
            <input id="manualZhuyin" inputmode="text" placeholder="會自動帶入，可手動改" />
          </div>
          <div class="manual-field">
            <label for="manualWhy">理由</label>
            <input id="manualWhy" inputmode="text" placeholder="想練習位置和存在句。" />
          </div>
          <button class="btn" id="addManualChoiceBtn" type="button">加入自選字</button>
        </div>
      </section>

      <section class="panel ai-settings-panel" aria-labelledby="aiSettingsTitle">
        <h2 id="aiSettingsTitle">AI 句子服務</h2>
        <p class="help">填入 Cloudflare Worker URL 和老師 token 後，Planner 可以請 OpenAI 產生候選句。這裡不需要、也不能填 OpenAI API key。</p>
        <div class="ai-grid">
          <div class="ai-field">
            <label for="aiEndpoint">Worker URL</label>
            <input id="aiEndpoint" inputmode="url" placeholder="https://你的-worker.workers.dev" />
          </div>
          <div class="ai-field">
            <label for="aiToken">老師 token</label>
            <input id="aiToken" type="password" autocomplete="off" placeholder="TEACHER_TOKEN" />
          </div>
          <button class="btn secondary" id="saveAiSettingsBtn" type="button">儲存 AI 設定</button>
        </div>
        <div class="ai-status" id="aiStatusLine"></div>
      </section>

      <div class="status" id="statusLine"></div>

      <section class="choice-list" id="choiceList"></section>

      <section class="request-panel" id="requestPanel" hidden>
        <h2>完整 lesson request 預覽</h2>
        <p class="help">先選一個候選字，再勾選或新增句子。草稿會依課號保存在這台裝置；按送出後，看到內容貼進 Codex 對話才算真的送到。</p>
        <textarea id="requestOutput" spellcheck="false"></textarea>
        <div class="request-actions">
          <button class="btn danger" id="submitBtn" type="button">送出給 Codex</button>
          <button class="btn" id="copyBtn" type="button">複製 JSON</button>
          <button class="btn secondary" id="downloadBtn" type="button">下載 JSON</button>
          <button class="btn secondary" id="clearDraftBtn" type="button">清除本課草稿</button>
        </div>
      </section>
    </main>

    <script>
      const state = {
        data: null,
        recommendations: [],
        selectedChoiceId: "",
        previewChoiceId: "",
        planOffset: 1,
        plannedLessons: {},
        storageKey: "",
        selectedIndexes: new Map(),
        candidateEditsBySentence: new Map(),
        candidateDraftsBySentence: new Map(),
        candidateEditingKeys: new Set(),
        imageNotesBySentence: new Map(),
        customRowsByChoice: new Map(),
        customDraftsByChoice: new Map(),
        feedbackByChoice: new Map(),
        manualChoices: [],
        manualDraft: { char: "", zhuyin: "", why: "" },
        aiSettings: { endpoint: "", token: "" },
        aiGeneratingChoiceId: "",
        aiRecommending: false,
      };

      const sentenceLengthRange = { min: 4, max: 12 };
      const targetApprovedSentenceCount = 5;
      const targetGeneratedSentenceCount = 10;
      const targetReviewCandidateCount = 8;
      const targetNewCharCountInLesson = 3;
      const plannerStoragePrefix = "character-recognition-dojo:lesson-planner:v2:";
      const activePlannerStorageKey = `${plannerStoragePrefix}active`;
      const aiSettingsStorageKey = "character-recognition-dojo:lesson-planner:ai-settings:v1";
      const fallbackZhuyinByChar = {
        和: "ㄏㄜˊ",
        很: "ㄏㄣˇ",
        是: "ㄕˋ",
      };
      const $ = (id) => document.getElementById(id);

      function hanChars(text) {
        return Array.from(text || "").filter((char) => /\p{Script=Han}/u.test(char));
      }

      function unique(items) {
        return [...new Set(items)];
      }

      function lessonId(order) {
        return `L${String(order).padStart(3, "0")}`;
      }

      function lessonOrderFromId(id) {
        const match = String(id || "").match(/^L(\d+)$/i);
        return match ? Number(match[1]) : 0;
      }

      function lastLessons(lessons, count) {
        return [...lessons].sort((a, b) => a.order - b.order).slice(-count);
      }

      function recentReviewPool(lessons) {
        return unique(
          lastLessons(lessons, 5).flatMap((lesson) =>
            (lesson.sentences || []).flatMap((sentence) => hanChars(sentence.text)),
          ),
        );
      }

      function previousLessonNewChars(lessons, count) {
        return unique(lastLessons(lessons, count).flatMap((lesson) => lesson.newChars || []));
      }

      function sentenceHanLength(sentence) {
        return hanChars(sentence.text).length;
      }

      function forbiddenChars(sentence, allowedChars) {
        const allowed = new Set(allowedChars);
        return unique(hanChars(sentence.text).filter((char) => !allowed.has(char)));
      }

      function normalizeSpokenText(text) {
        return String(text || "")
          .replace(/[，。！？、；：,.!?;:]/g, "")
          .trim();
      }

      function cleanSentences(sentences, allowedChars) {
        return (sentences || [])
          .map((sentence) => ({
            text: String(sentence.text || ""),
            spokenText: normalizeSpokenText(sentence.spokenText || sentence.text || ""),
            focusChar: String(sentence.focusChar || ""),
            reason: String(sentence.reason || ""),
          }))
          .filter((sentence) => {
            const length = sentenceHanLength(sentence);
            return (
              sentence.text &&
              forbiddenChars(sentence, allowedChars).length === 0 &&
              length >= sentenceLengthRange.min &&
              length <= sentenceLengthRange.max
            );
          });
      }

      function charCountInText(text, char) {
        return hanChars(text).filter((candidate) => candidate === char).length;
      }

      function sentenceAllowed(text, allowedChars) {
        const allowed = new Set(allowedChars);
        const chars = hanChars(text);
        const length = chars.length;
        return length >= sentenceLengthRange.min && length <= sentenceLengthRange.max && chars.every((char) => allowed.has(char));
      }

      function phraseAllowed(text, allowedChars) {
        const allowed = new Set(allowedChars);
        return hanChars(text).every((char) => allowed.has(char));
      }

      function addPhrase(list, text, allowedChars) {
        if (text && phraseAllowed(text, allowedChars) && !list.includes(text)) list.push(text);
      }

      function phraseBank(allowedChars, targetChar) {
        const subjects = [];
        const places = [];
        const things = [];
        const targetPhrases = [];
        const nonObjectChars = new Set(["在", "上", "下", "很", "高", "和", "看", "去", "來", "飛", "是", "中", "前", "後", "裡", "左", "右"]);
        const zhiMeasureTargets = new Set(["鳥", "手", "指"]);
        const geMeasureTargets = new Set(["家", "門", "山", "人"]);
        const objectLike = !nonObjectChars.has(targetChar);

        [
          "我",
          "你",
          "你和我",
          "我和你",
          "大人",
          "小孩",
          "一個人",
          "一個小孩",
          "三個人",
          "大人和小孩",
        ].forEach((phrase) => addPhrase(subjects, phrase, allowedChars));

        [
          "家",
          "我家",
          "你家",
          "山上",
          "山下",
          "高山上",
          "高山下",
          "水上",
          "水下",
          "家中",
          "水中",
          "家裡",
          "水裡",
          "家前",
          "家後",
          "山前",
          "山後",
          "門前",
          "門後",
        ].forEach((phrase) => addPhrase(places, phrase, allowedChars));

        [
          "手",
          "大手",
          "小手",
          "手指",
          "一隻手",
          "一隻小手",
          "一隻大手",
          "鳥",
          "小鳥",
          "一隻鳥",
          "一隻小鳥",
          "三隻小鳥",
          "家",
          "小家",
          "水",
          "山",
          "高山",
        ].forEach((phrase) => addPhrase(things, phrase, allowedChars));

        if (objectLike) {
          addPhrase(targetPhrases, targetChar, allowedChars);
          [`小${targetChar}`, `大${targetChar}`, `很大的${targetChar}`, `很小的${targetChar}`, `很高的${targetChar}`].forEach((phrase) =>
            addPhrase(targetPhrases, phrase, allowedChars),
          );
          if (geMeasureTargets.has(targetChar)) [`一個${targetChar}`, `三個${targetChar}`].forEach((phrase) => addPhrase(targetPhrases, phrase, allowedChars));
          if (zhiMeasureTargets.has(targetChar)) [`一隻${targetChar}`, `三隻${targetChar}`].forEach((phrase) => addPhrase(targetPhrases, phrase, allowedChars));
        }

        return {
          subjects: subjects.length ? subjects : ["我"].filter((phrase) => phraseAllowed(phrase, allowedChars)),
          places,
          things,
          targetPhrases: unique(targetPhrases.filter((phrase) => phraseAllowed(phrase, allowedChars))),
        };
      }

      function generatedSpecificPatternPool(choice, allowedChars) {
        const targetChar = choice.newChars[0];
        const pool = [];
        const seen = new Set();
        const add = (text, reason = "自我審核通過：功能字句型，語意具體，容易配圖。", focusChar = targetChar) =>
          addSentenceCandidate(pool, seen, text, choice, allowedChars, reason, focusChar);

        if (targetChar === "是") {
          [
            "門前的是男孩",
            "門後的是女孩",
            "飛的是一隻鳥",
            "山上的是小鳥",
            "水上的是小鳥",
            "我看的是小鳥",
            "你看的是男孩",
            "我家是高山上的家",
            "我是女孩",
            "你是男孩",
            "男孩是小孩",
            "女孩是小孩",
            "男人是大人",
            "女人是大人",
            "大人是人",
            "小孩是人",
            "小鳥是鳥",
            "飛鳥是鳥",
            "一隻飛鳥是鳥",
            "高山是山",
            "小家是家",
            "我家是小家",
            "前門是門",
            "後門是門",
            "門前是高山",
            "門後是水",
            "男孩和女孩是小孩",
            "你和我是小孩",
          ].forEach((text) => add(text));
        }

        return pool;
      }

      function addSentenceCandidate(pool, seen, text, choice, allowedChars, reason, focusChar = "") {
        const normalized = normalizeSpokenText(text);
        if (!sentenceAllowed(text, allowedChars) || seen.has(text)) return;
        seen.add(text);
        pool.push({
          text,
          spokenText: normalized,
          focusChar: focusChar || (hanChars(text).includes(choice.newChars[0]) ? choice.newChars[0] : resolveFocusChar(text, "", choice)),
          reason,
        });
      }

      function generatedPatternPool(choice, model, allowedChars, includeTargetPatterns = true) {
        const targetChar = choice.newChars[0];
        const bank = phraseBank(allowedChars, targetChar);
        const pool = [];
        const seen = new Set();
        const add = (text, reason, focusChar = targetChar) => addSentenceCandidate(pool, seen, text, choice, allowedChars, reason, focusChar);

        for (const sentence of generatedSpecificPatternPool(choice, allowedChars)) {
          add(sentence.text, sentence.reason, sentence.focusChar);
        }

        if (includeTargetPatterns) {
          for (const targetPhrase of bank.targetPhrases) {
            for (const place of bank.places) {
              add(`${targetPhrase}在${place}`, "最佳化器依已核准課程的「物／人在位置」句型產生。");
              add(`${place}有${targetPhrase}`, "最佳化器依已核准課程的「位置有物」句型產生。");
            }
            for (const subject of bank.subjects) {
              add(`${subject}有${targetPhrase}`, "最佳化器依已核准課程的「人物有物」句型產生。");
              if (phraseAllowed("和", allowedChars)) add(`${subject}和${targetPhrase}在家`, "最佳化器依已核准課程的互動句型產生。");
              if (phraseAllowed("看", allowedChars)) add(`${subject}看${targetPhrase}`, "最佳化器依已核准課程的看圖動作句型產生。");
            }
            for (const thing of bank.things) {
              if (phraseAllowed("和", allowedChars)) add(`${targetPhrase}和${thing}`, "最佳化器依已核准課程的並列句型產生。");
              if (phraseAllowed("上", allowedChars)) add(`${targetPhrase}在${thing}上`, "最佳化器依已核准課程的位置句型產生。");
              if (phraseAllowed("下", allowedChars)) add(`${targetPhrase}在${thing}下`, "最佳化器依已核准課程的位置句型產生。");
            }
            if (phraseAllowed(`很大`, allowedChars)) add(`${targetPhrase}很大`, "最佳化器依已核准課程的形容句型產生。");
            if (phraseAllowed(`很小`, allowedChars)) add(`${targetPhrase}很小`, "最佳化器依已核准課程的形容句型產生。");
            if (phraseAllowed(`很高`, allowedChars)) add(`${targetPhrase}很高`, "最佳化器依已核准課程的形容句型產生。");
          }
        }

        const targetBearingCount = pool.filter((sentence) => hanChars(sentence.text).includes(targetChar)).length;
        if (targetBearingCount < targetGeneratedSentenceCount) {
          const recentReviewSentences = lastLessons(model.lessons, 5)
            .flatMap((lesson) => lesson.sentences || [])
            .map((sentence) => sentence.text)
            .filter((text) => sentenceAllowed(text, allowedChars));
          for (const text of recentReviewSentences) {
            add(text, "直接取自近五課已核准句，作為複習候選。", resolveFocusChar(text, "", choice));
          }
        }

        return pool;
      }

      function badSentencePenalty(text) {
        const badPatterns = ["二個", "來家", "去家", "飛在家上", "大門在家下", "小鳥飛在家上", "有是", "是有", "和是", "是和", "在是"];
        const weakButAllowedPatterns = ["前門是門", "後門是門", "小鳥是鳥", "飛鳥是鳥", "高山是山", "小家是家"];
        if (badPatterns.some((pattern) => text.includes(pattern))) return 80;
        return weakButAllowedPatterns.some((pattern) => text.includes(pattern)) ? 90 : 0;
      }

      function sentenceQuality(sentence, context) {
        const chars = hanChars(sentence.text);
        const uniqueChars = unique(chars);
        const targetHits = chars.filter((char) => char === context.targetChar).length;
        const reviewHits = uniqueChars.filter((char) => context.reviewCountChars.includes(char)).length;
        const requiredHits = uniqueChars.filter((char) => context.requiredRecentChars.includes(char)).length;
        const length = chars.length;
        const lengthBonus = length >= 6 && length <= 10 ? 16 : length >= 4 && length <= 12 ? 8 : -40;
        const sourceBonus = sentence.reason.includes("已核准") || sentence.reason.includes("近五課") ? 9 : 0;
        return targetHits * 34 + reviewHits * 9 + requiredHits * 13 + lengthBonus + sourceBonus - badSentencePenalty(sentence.text);
      }

      function planMetrics(sentences, context) {
        const firstFive = sentences.slice(0, targetApprovedSentenceCount);
        const allText = firstFive.map((sentence) => sentence.text).join("");
        const targetCount = charCountInText(allText, context.targetChar);
        const reviewCovered = context.reviewCountChars.filter((char) => allText.includes(char));
        const requiredCovered = context.requiredRecentChars.filter((char) => allText.includes(char));
        return {
          targetCount,
          reviewCovered,
          missingReviewChars: context.reviewCountChars.filter((char) => !reviewCovered.includes(char)),
          requiredCovered,
          missingRequiredChars: context.requiredRecentChars.filter((char) => !requiredCovered.includes(char)),
        };
      }

      function optimizeSentencePool(pool, context) {
        const selected = [];
        const remaining = [...pool]
          .map((sentence) => ({ sentence, baseScore: sentenceQuality(sentence, context) }))
          .sort((a, b) => b.baseScore - a.baseScore);

        for (let slot = 0; slot < targetGeneratedSentenceCount && remaining.length > 0; slot += 1) {
          const currentText = selected.map((sentence) => sentence.text).join("");
          const missingReview = context.reviewCountChars.filter((char) => !currentText.includes(char));
          const missingRequired = context.requiredRecentChars.filter((char) => !currentText.includes(char));
          const currentTargetCount = charCountInText(currentText, context.targetChar);
          let bestIndex = 0;
          let bestValue = -Infinity;

          for (let index = 0; index < remaining.length; index += 1) {
            const { sentence, baseScore } = remaining[index];
            const chars = hanChars(sentence.text);
            const targetHits = chars.filter((char) => char === context.targetChar).length;
            const reviewGain = missingReview.filter((char) => chars.includes(char)).length;
            const requiredGain = missingRequired.filter((char) => chars.includes(char)).length;
            const needsTarget = slot < 3 || currentTargetCount < targetNewCharCountInLesson;
            const targetBonus = needsTarget ? targetHits * 55 : targetHits * 8;
            const noTargetPenalty = needsTarget && targetHits === 0 ? 120 : 0;
            const coverageBonus = slot >= 3 ? reviewGain * 28 + requiredGain * 40 : reviewGain * 12 + requiredGain * 18;
            const value = baseScore + targetBonus + coverageBonus - noTargetPenalty - selected.length * 0.2;
            if (value > bestValue) {
              bestValue = value;
              bestIndex = index;
            }
          }

          selected.push(remaining.splice(bestIndex, 1)[0].sentence);
        }

        return selected;
      }

      function optimizeChoiceSentencesFromEntry(entry, context) {
        const choice = {
          choiceId: `choice-${entry.char}`,
          newChars: [entry.char],
          zhuyin: { [entry.char]: entry.zhuyin },
        };
        const allowedChars = unique([...context.learnedChars, entry.char]);
        const seen = new Set();
        const pool = [];
        const localSentences = cleanSentences(entry.sentenceCandidates, allowedChars);
        for (const sentence of localSentences) {
          addSentenceCandidate(pool, seen, sentence.text, choice, allowedChars, sentence.reason || "候選字資料庫句，經最佳化器重新排序。", sentence.focusChar);
        }
        const includeTargetPatterns = localSentences.length < Math.min(6, targetGeneratedSentenceCount);
        for (const sentence of generatedPatternPool(choice, { lessons: context.lessons }, allowedChars, includeTargetPatterns)) {
          addSentenceCandidate(pool, seen, sentence.text, choice, allowedChars, sentence.reason, sentence.focusChar);
        }
        const optimized = optimizeSentencePool(pool, { ...context, targetChar: entry.char });
        return {
          candidates: optimized,
          metrics: planMetrics(optimized, { ...context, targetChar: entry.char }),
          poolSize: pool.length,
        };
      }

      function emptyOptimization(context, targetChar) {
        const emptyContext = { ...context, targetChar };
        return {
          candidates: [],
          metrics: planMetrics([], emptyContext),
          poolSize: 0,
        };
      }

      function optimizeChoiceSentences(choice, model) {
        return optimizeChoiceSentencesFromEntry(
          {
            char: choice.newChars[0],
            zhuyin: choice.zhuyin?.[choice.newChars[0]] || "",
            sentenceCandidates: choice.sentenceCandidates || [],
          },
          {
            lessons: model.lessons,
            learnedChars: model.learnedChars,
            requiredRecentChars: model.requiredRecentChars,
            reviewCountChars: model.reviewCountChars,
          },
        );
      }

      function scoreCandidate(entry, learnedChars, recentPool, requiredRecentChars, reviewCountChars, optimization, lessons = []) {
        const learned = new Set(learnedChars);
        const requiredMissing = (entry.requires || []).filter((char) => !learned.has(char));
        if (requiredMissing.length > 0 || learned.has(entry.char)) return null;
        const recent = new Set(recentPool);
        const requiredRecent = new Set(requiredRecentChars || []);
        const reviewCount = new Set(reviewCountChars || []);
        const allowedChars = unique([...learnedChars, entry.char]);
        const optimized =
          optimization ||
          optimizeChoiceSentencesFromEntry(entry, {
            lessons,
            learnedChars,
            requiredRecentChars,
            reviewCountChars,
          });
        const validSentences = optimized.candidates.length ? optimized.candidates : cleanSentences(entry.sentenceCandidates, allowedChars);
        const sentenceChars = unique(validSentences.flatMap((sentence) => hanChars(sentence.text)));
        const reviewHits = sentenceChars.filter((char) => recent.has(char)).length;
        const requiredHits = sentenceChars.filter((char) => requiredRecent.has(char)).length;
        const reviewCountHits = sentenceChars.filter((char) => reviewCount.has(char)).length;
        const sentenceDepth = Math.min(validSentences.length, targetGeneratedSentenceCount);
        const missingSentencePenalty = Math.max(0, 5 - validSentences.length) * 20;
        const firstFive = validSentences.slice(0, targetApprovedSentenceCount);
        const firstFiveText = firstFive.map((sentence) => sentence.text).join("");
        const targetHitsInPlan = charCountInText(firstFiveText, entry.char);
        const missingTargetPenalty = Math.max(0, targetNewCharCountInLesson - targetHitsInPlan) * 42;
        const missingReviewPenalty = Math.max(0, reviewCountChars.length - (optimized.metrics?.reviewCovered.length || 0)) * 7;
        return (
          Number(entry.priority || 1000) -
          targetHitsInPlan * 18 -
          requiredHits * 12 -
          reviewCountHits * 6 -
          reviewHits * 2 -
          sentenceDepth * 2 +
          missingSentencePenalty +
          missingTargetPenalty +
          missingReviewPenalty -
          Math.min(optimized.poolSize || 0, 80) * 0.15
        );
      }

      function clampPlanOffset(value) {
        return value === 2 || value === "2" ? 2 : 1;
      }

      function plannedLessonKey(order) {
        return lessonId(order);
      }

      function plannedLessonForOrder(order) {
        const plan = state.plannedLessons?.[plannedLessonKey(order)];
        return plan?.newChars?.length ? plan : null;
      }

      function upstreamPlans(latestOrder, planOffset = state.planOffset) {
        const plans = [];
        for (let offset = 1; offset < clampPlanOffset(planOffset); offset += 1) {
          const plan = plannedLessonForOrder(latestOrder + offset);
          if (plan) plans.push(plan);
        }
        return plans;
      }

      function chooseRecentPool(lessons, planned) {
        return unique([...recentReviewPool(lessons), ...planned.flatMap((plan) => plan.newChars || [])]);
      }

      function previousRequiredChars(lessons, planned, count) {
        const completed = lessons.map((lesson) => ({ order: lesson.order, newChars: lesson.newChars || [] }));
        const provisional = planned.map((plan) => ({ order: plan.order, newChars: plan.newChars || [] }));
        return unique([...completed, ...provisional].sort((a, b) => a.order - b.order).slice(-count).flatMap((lesson) => lesson.newChars));
      }

      function recentLessonNewChars(lessons, planned, count) {
        const completed = lessons.map((lesson) => ({ order: lesson.order, newChars: lesson.newChars || [] }));
        const provisional = planned.map((plan) => ({ order: plan.order, newChars: plan.newChars || [] }));
        return unique([...completed, ...provisional].sort((a, b) => a.order - b.order).slice(-count).flatMap((lesson) => lesson.newChars));
      }

      function recommend(data) {
        const lessons = [...(data.lessons || [])].sort((a, b) => a.order - b.order);
        const latestOrder = Math.max(...lessons.map((lesson) => lesson.order));
        const planOffset = clampPlanOffset(state.planOffset);
        const order = latestOrder + planOffset;
        const planned = upstreamPlans(latestOrder, planOffset);
        const provisionalLearnedChars = unique(planned.flatMap((plan) => plan.newChars || []));
        const learnedChars = unique([...lessons.flatMap((lesson) => lesson.newChars || []), ...provisionalLearnedChars]);
        const recentPool = chooseRecentPool(lessons, planned);
        const requiredRecentChars = previousRequiredChars(lessons, planned, 3);
        const reviewCountChars = recentLessonNewChars(lessons, planned, 5);
        const bankEntries = data.nextCharacterBank || [];
        const manualChoiceChars = new Set(state.manualChoices.map((entry) => entry.char));
        const manualEntries = state.manualChoices
          .filter((entry) => entry.char)
          .map((entry, index) => ({
            ...(bankEntries.find((bankEntry) => bankEntry.char === entry.char) || {}),
            ...entry,
            zhuyin: entry.zhuyin || bankEntries.find((bankEntry) => bankEntry.char === entry.char)?.zhuyin || "",
            priority: 5 + index,
            why: entry.why || bankEntries.find((bankEntry) => bankEntry.char === entry.char)?.why || "教師自行新增的下一課字。",
            requires: [],
            sentenceCandidates:
              entry.sentenceCandidates?.length
                ? entry.sentenceCandidates
                : bankEntries.find((bankEntry) => bankEntry.char === entry.char)?.sentenceCandidates || [],
            source: "manual",
          }));
        const recommendations = [...manualEntries, ...bankEntries.filter((entry) => !manualChoiceChars.has(entry.char))]
          .map((entry) => {
            const shouldSkipLocalManualGeneration = entry.source === "manual" && !(entry.sentenceCandidates || []).length;
            const optimization = shouldSkipLocalManualGeneration
              ? emptyOptimization({ lessons, learnedChars, requiredRecentChars, reviewCountChars }, entry.char)
              : optimizeChoiceSentencesFromEntry(entry, {
                  lessons,
                  learnedChars,
                  requiredRecentChars,
                  reviewCountChars,
                });
            const score = scoreCandidate(entry, learnedChars, recentPool, requiredRecentChars, reviewCountChars, optimization, lessons);
            if (score === null) return null;
            return {
              choiceId: `choice-${entry.char}`,
              newChars: [entry.char],
              zhuyin: { [entry.char]: entry.zhuyin },
              title: entry.char,
              rationale: entry.why,
              score: manualChoiceChars.has(entry.char) ? score - 10000 : score,
              source: entry.source || "bank",
              optimization,
              sentenceCandidates:
                entry.source === "manual"
                  ? optimization.candidates.map((sentence) => ({
                      ...sentence,
                      reason: sentence.reason.startsWith("自我審核通過")
                        ? sentence.reason
                        : `自我審核通過：${sentence.reason}`,
                    }))
                  : optimization.candidates,
            };
          })
          .filter(Boolean)
          .sort((a, b) => a.score - b.score)
          .slice(0, 5);
        return {
          lessons,
          latestOrder,
          order,
          lessonId: lessonId(order),
          planOffset,
          dependencyPlans: planned,
          provisionalLearnedChars,
          provisionalReviewChars: reviewCountChars.filter((char) => provisionalLearnedChars.includes(char)),
          provisionalRequiredRecentChars: requiredRecentChars.filter((char) => provisionalLearnedChars.includes(char)),
          learnedChars,
          recentPool,
          requiredRecentChars,
          reviewCountChars,
          recommendations,
        };
      }

      function renderSummary(model) {
        $("summaryPanel").innerHTML = `
          <div class="summary-grid">
            <div class="metric"><strong>${model.lessonId}</strong><span>${model.planOffset === 2 ? "下下一課" : "下一課"}</span></div>
            <div class="metric"><strong>${model.learnedChars.length}</strong><span>已學漢字</span></div>
            <div class="metric"><strong>${model.latestOrder}</strong><span>目前課數</span></div>
            <div class="metric"><strong>${model.recommendations.length}</strong><span>候選字</span></div>
          </div>
          <p class="help">資料匯出時間：${state.data.exportedAt || "未知"}</p>
          <p class="help">課程最佳化：前 3 句優先讓本課新字至少出現 ${targetNewCharCountInLesson} 次；後 2 句優先補近 5 課新字；每句 ${sentenceLengthRange.min}-${sentenceLengthRange.max} 個漢字；近 3 課新字 ${model.requiredRecentChars.join("、")} 在整課句子中至少各出現一次。</p>
          <div class="learned">${model.learnedChars.map((char) => `<span>${char}</span>`).join("")}</div>
        `;
      }

      function renderPlanSlotPanel(model) {
        const firstOrder = model.latestOrder + 1;
        const secondOrder = model.latestOrder + 2;
        const firstPlan = plannedLessonForOrder(firstOrder);
        const secondPlan = plannedLessonForOrder(secondOrder);
        const dependencies = model.dependencyPlans || [];
        $("planSlotPanel").innerHTML = `
          <h2>規劃第幾課</h2>
          <div class="plan-slot-controls" role="radiogroup" aria-label="規劃課程槽位">
            <label class="plan-slot">
              <input type="radio" name="planOffset" value="1" ${model.planOffset === 1 ? "checked" : ""} />
              <strong>${lessonId(firstOrder)} 下一課</strong>
              <span>${firstPlan ? `暫定：${firstPlan.newChars.join("")}` : "先規劃這一課的新字。"}</span>
            </label>
            <label class="plan-slot">
              <input type="radio" name="planOffset" value="2" ${model.planOffset === 2 ? "checked" : ""} />
              <strong>${lessonId(secondOrder)} 下下一課</strong>
              <span>${firstPlan ? `會先把 ${firstPlan.newChars.join("")} 當作已學字。` : `可先規劃，但最好先在 ${lessonId(firstOrder)} 確定新字。`}</span>
            </label>
          </div>
          ${
            dependencies.length
              ? `<div class="dependency-note">這個 request 會標註依賴：先讓 ${dependencies
                  .map((plan) => `${lessonId(plan.order)}「${plan.newChars.join("")}」`)
                  .join("、")} 合併進 main，再合併本課。</div>`
              : ""
          }
          ${secondPlan ? `<div class="dependency-note">已暫存 ${lessonId(secondOrder)}：${secondPlan.newChars.join("")}</div>` : ""}
        `;
      }

      function renderManualChoiceForm() {
        $("manualChar").value = state.manualDraft.char;
        $("manualZhuyin").value = state.manualDraft.zhuyin;
        $("manualWhy").value = state.manualDraft.why;
      }

      function renderAiSettingsForm() {
        $("aiEndpoint").value = state.aiSettings.endpoint;
        $("aiToken").value = state.aiSettings.token;
        $("aiStatusLine").textContent = state.aiSettings.endpoint
          ? "AI 服務已設定。按候選字卡片裡的「AI 生成 10 句」即可使用。"
          : "尚未設定 AI 服務；可以先加入自選字，再把 request 貼給 Codex，或完成 Worker 設定後直接在這裡生成。";
      }

      function renderCustomSection(choice, selected, customRows, draft, feedback) {
        return `
          <section class="custom-section">

            <div class="draft-box">

              <div class="custom-grid">
