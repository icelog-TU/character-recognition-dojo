                <input aria-label="新句子 spokenText" placeholder="spokenText，可留空" value="${escapeAttr(draft.spokenText)}" data-draft-choice="${choice.choiceId}" data-field="spokenText" />
                <input aria-label="新句子 focus" placeholder="focus，可留空" value="${escapeAttr(draft.focusChar)}" data-draft-choice="${choice.choiceId}" data-field="focusChar" />
                <textarea class="note-input" aria-label="新句子配圖要求" placeholder="配圖要求，可留空。例如：山要有三座，角色不要太小。" data-draft-choice="${choice.choiceId}" data-field="imageNotes">${escapeHtml(draft.imageNotes)}</textarea>
              </div>
              <div class="custom-tools">
                <button class="btn secondary" type="button" data-add-custom="${choice.choiceId}">新增這句</button>
                <span class="custom-feedback">${escapeHtml(feedback)}</span>
              </div>
            </div>
            ${
              customRows.length
                ? `<div class="added-list">
                    <h4>已新增成功的句子</h4>
                    ${customRows
                      .map(
                        (row, index) => `
                          <div class="added-row ${row.editing ? "editing" : ""}">
                            <div class="added-row-head">
                              <span class="pill">完成第 ${index + 1} 句</span>
                              <div class="header-actions">
                                <button class="btn secondary" type="button" data-edit-custom="${choice.choiceId}" data-custom="${index}">${row.editing ? "收起編輯" : "編輯"}</button>
                                <button class="btn secondary" type="button" data-remove-custom="${choice.choiceId}" data-custom="${index}">移除</button>
                              </div>
                            </div>
                            <div class="added-sentence">${escapeHtml(row.text)}</div>
                            <div class="sentence-meta">
                              <span class="pill">spoken: ${escapeHtml(row.spokenText || row.text)}</span>
                              <span class="pill">focus: ${escapeHtml(row.focusChar || resolveFocusChar(row.text, "", choice))}</span>
                            </div>
                            ${
                              row.imageNotes
                                ? `<div class="added-notes"><strong>配圖要求：</strong>${escapeHtml(row.imageNotes)}</div>`
                                : ""
                            }
                            <div class="custom-grid edit-fields">
                              <input aria-label="已新增句子" placeholder="句子" value="${escapeAttr(row.text)}" data-custom-choice="${choice.choiceId}" data-custom="${index}" data-field="text" />
                              <input aria-label="已新增 spokenText" placeholder="spokenText，可留空" value="${escapeAttr(row.spokenText)}" data-custom-choice="${choice.choiceId}" data-custom="${index}" data-field="spokenText" />
                              <input aria-label="已新增 focus" placeholder="focus" value="${escapeAttr(row.focusChar)}" data-custom-choice="${choice.choiceId}" data-custom="${index}" data-field="focusChar" />
                              <textarea class="note-input" aria-label="已新增配圖要求" placeholder="配圖要求，可留空" data-custom-choice="${choice.choiceId}" data-custom="${index}" data-field="imageNotes">${escapeHtml(row.imageNotes)}</textarea>
                            </div>
                          </div>
                        `,
                      )
                      .join("")}
                  </div>`
                : ""
            }
            ${
              selected
                ? `<div class="nearby-request-panel">
                    <h4>送出這一課</h4>
                    <p class="help">句子都確認後，從這裡就近複製或分享給 Codex。這個網頁不會直接連到 Codex，看到內容貼進對話才算送出。</p>
                    <div class="request-actions">
                      <button class="btn danger" type="button" data-submit-request>送出給 Codex</button>
                      <button class="btn" type="button" data-copy-request>複製 JSON</button>
                      <button class="btn secondary" type="button" data-download-request>下載 JSON</button>
                    </div>
                  </div>`
                : ""
            }
          </section>
        `;
      }

      function aiGenerateButtonText(choice) {
        if (state.aiGeneratingChoiceId === choice.choiceId) return "AI 生成中";
        return choice.sentenceCandidates.length ? "AI 再生成 10 句" : "AI 生成 10 句";
      }

      function renderChoices(model) {
        const originalRanks = new Map(model.recommendations.map((choice, index) => [choice.choiceId, index + 1]));
        const orderedRecommendations = [...model.recommendations].sort((a, b) => {
          if (a.choiceId === state.selectedChoiceId) return -1;
          if (b.choiceId === state.selectedChoiceId) return 1;
          if (a.choiceId === state.previewChoiceId) return -1;
          if (b.choiceId === state.previewChoiceId) return 1;
          return (originalRanks.get(a.choiceId) || 0) - (originalRanks.get(b.choiceId) || 0);
        });
        $("choiceList").innerHTML = orderedRecommendations
          .map((choice, choiceIndex) => {
            const selected = choice.choiceId === state.selectedChoiceId;
            const previewing = selected || choice.choiceId === state.previewChoiceId;
            const customRows = state.customRowsByChoice.get(choice.choiceId) || [];
            const selectedIndexes = state.selectedIndexes.get(choice.choiceId) || new Set();
            const completedCustomCount = customRows.filter((row) => row.text.trim()).length;
            const selectedSentenceCount = selectedIndexes.size + completedCustomCount;
            const remainingSentenceCount = Math.max(targetApprovedSentenceCount - selectedSentenceCount, 0);
            const overSentenceCount = Math.max(selectedSentenceCount - targetApprovedSentenceCount, 0);
            const sortedSentenceCandidates = choice.sentenceCandidates
              .map((sentence, sentenceIndex) => ({ sentence, sentenceIndex }))
              .sort((a, b) => {
                const selectedDelta = Number(selectedIndexes.has(b.sentenceIndex)) - Number(selectedIndexes.has(a.sentenceIndex));
                return selectedDelta || a.sentenceIndex - b.sentenceIndex;
              });
            const draft = state.customDraftsByChoice.get(choice.choiceId) || { text: "", spokenText: "", focusChar: "", imageNotes: "" };
            const feedback = state.feedbackByChoice.get(choice.choiceId) || "";
            return `
              <article class="choice-card ${selected ? "selected" : ""} ${previewing && !selected ? "previewing" : ""} ${previewing ? "" : "compact"}" data-choice-card="${choice.choiceId}">
                <div class="choice-head">
                  <div class="char-badge">${choice.newChars.join("")}</div>
                  <div>
                    <h2>${selected ? "已選" : `${originalRanks.get(choice.choiceId) || choiceIndex + 1}.`} ${choice.newChars.join("")} ${Object.values(choice.zhuyin).join(" ")}</h2>
                    <p>${choice.rationale}</p>
                    ${optimizerSummaryHtml(choice, model)}
                  </div>
                  <div class="choice-actions">
                    <button class="btn secondary" type="button" ${selected ? "disabled" : `data-preview="${choice.choiceId}"`}>
                      ${selected ? "正在編輯" : previewing ? "收起句子" : "看句子"}
                    </button>
                    ${
                      previewing && !selected
                        ? `<button class="btn" type="button" data-select="${choice.choiceId}">確定選這個字</button>`
                        : ""
                    }
                    ${
                      selected
                        ? `<button class="btn secondary" type="button" data-unselect="${choice.choiceId}">取消選字</button>`
                        : ""
                    }
                    ${
                      previewing
                        ? `<button class="btn secondary" type="button" data-ai-generate="${choice.choiceId}" ${state.aiGeneratingChoiceId ? "disabled" : ""}>${aiGenerateButtonText(choice)}</button>`
                        : ""
                    }
                  </div>
                </div>
                ${
                  selected
                    ? `<div class="selection-meter ${overSentenceCount ? "warning" : ""}" aria-live="polite">
                        <strong>${selectedSentenceCount}/${targetApprovedSentenceCount} 句</strong>
                        <span>${
                          overSentenceCount
                            ? `多了 ${overSentenceCount} 句，可以再精簡。`
                            : remainingSentenceCount
                              ? `還差 ${remainingSentenceCount} 句。`
                              : "剛好 5 句，可以送出。"
                        }</span>
                      </div>`
                    : ""
                }
                ${selected ? reviewCoverageHtml(model, choice) : ""}
                ${renderCustomSection(choice, selected, customRows, draft, feedback)}
                <div class="sentence-list">
                  ${
                    choice.sentenceCandidates.length
                      ? sortedSentenceCandidates
                          .map(({ sentence, sentenceIndex }) => {
                            const checked = selectedIndexes.has(sentenceIndex);
                            const key = sentenceKey(choice.choiceId, sentenceIndex);
                            const editedSentence = candidateSentence(choice, sentenceIndex);
                            const draftSentence = candidateDraft(choice, sentenceIndex);
                            const hasEdit = state.candidateEditsBySentence.has(key);
                            const editing = state.candidateEditingKeys.has(key);
                            const imageNotes = state.imageNotesBySentence.get(sentenceKey(choice.choiceId, sentenceIndex)) || "";
                            return `
                              <div class="sentence-row ${checked ? "checked" : ""} ${hasEdit ? "edited" : ""}">
                                <input type="checkbox" data-choice="${choice.choiceId}" data-index="${sentenceIndex}" ${checked ? "checked" : ""} />
                                <div>
                                  <div class="sentence-text">${escapeHtml(editedSentence.text)}</div>
                                  <div class="sentence-meta">
                                    ${hasEdit ? `<span class="pill">已修改</span>` : ""}
                                    <span class="pill">spoken: ${escapeHtml(editedSentence.spokenText)}</span>
                                    <span class="pill">focus: ${escapeHtml(editedSentence.focusChar)}</span>
                                  </div>
                                  ${hasEdit ? `<div class="candidate-original">原 AI：${escapeHtml(sentence.text)}</div>` : ""}
                                  <p>${sentence.reason}</p>
                                  <div class="candidate-tools">
                                    <button class="btn secondary" type="button" data-edit-candidate="${choice.choiceId}" data-index="${sentenceIndex}">${editing ? "收起修改" : "修改"}</button>
                                    ${hasEdit ? `<button class="btn secondary" type="button" data-reset-candidate="${choice.choiceId}" data-index="${sentenceIndex}">還原 AI 句子</button>` : ""}
                                  </div>
                                  ${
                                    editing
                                      ? `<div class="candidate-edit-panel">
                                          <div class="candidate-edit-grid">
                                            <input aria-label="候選句文字" placeholder="句子" value="${escapeAttr(draftSentence.text)}" data-candidate-edit-choice="${choice.choiceId}" data-index="${sentenceIndex}" data-field="text" />
                                            <input aria-label="候選句 spokenText" placeholder="spokenText，可留空" value="${escapeAttr(draftSentence.spokenText)}" data-candidate-edit-choice="${choice.choiceId}" data-index="${sentenceIndex}" data-field="spokenText" />
                                            <input aria-label="候選句 focus" placeholder="focus" value="${escapeAttr(draftSentence.focusChar)}" data-candidate-edit-choice="${choice.choiceId}" data-index="${sentenceIndex}" data-field="focusChar" />
                                          </div>
                                          <div class="candidate-tools">
                                            <button class="btn" type="button" data-apply-candidate="${choice.choiceId}" data-index="${sentenceIndex}">套用修改</button>
                                            <button class="btn secondary" type="button" data-cancel-candidate="${choice.choiceId}" data-index="${sentenceIndex}">取消</button>
                                          </div>
                                        </div>`
                                      : ""
                                  }
                                  <textarea class="note-input" aria-label="候選句配圖要求" placeholder="配圖要求，可留空。例如：畫面要清楚看出二大一小，不要有文字。" data-image-note-choice="${choice.choiceId}" data-index="${sentenceIndex}">${escapeHtml(imageNotes)}</textarea>
                                </div>
                              </div>
                            `;
                          })
                          .join("")
                      : `<div class="sentence-row">
                          <div></div>
                          <div>
                            <div class="sentence-text">還沒有候選句</div>
                             <p>可以按下面按鈕立刻產生 10 句候選句，再逐句修改；也可以自己新增句子。</p>
                             <div class="candidate-tools">
                               <button class="btn" type="button" data-ai-generate="${choice.choiceId}" ${state.aiGeneratingChoiceId ? "disabled" : ""}>${aiGenerateButtonText(choice)}</button>
                               <button class="btn secondary" type="button" data-generate-candidates="${choice.choiceId}">本機草稿 10 句</button>
                             </div>
                          </div>
                        </div>`
                  }
                </div>
              </article>
            `;
          })
          .join("");
      }

      function selectedChoice() {
        return state.recommendations.find((choice) => choice.choiceId === state.selectedChoiceId);
      }

      function choiceById(choiceId) {
        return state.recommendations.find((choice) => choice.choiceId === choiceId);
      }

      function draftForChoice(choiceId) {
        const draft = state.customDraftsByChoice.get(choiceId) || { text: "", spokenText: "", focusChar: "", imageNotes: "" };
        state.customDraftsByChoice.set(choiceId, draft);
        return draft;
      }

      function setChoiceFeedback(choiceId, message) {
        state.feedbackByChoice.set(choiceId, message);
      }

      function sentenceKey(choiceId, sentenceIndex) {
        return `${choiceId}:${sentenceIndex}`;
      }

      function rawCandidateSentence(choice, sentenceIndex) {
        return choice.sentenceCandidates[sentenceIndex] || null;
      }

      function templateSentencesForChar(char) {
        if (char === "和") {
          return [
            "你和我在家",
            "我和你在家",
            "你和我在山上",
            "我和你在山下",
            "你和我在水上",
            "我和你在水下",
            "我的家和你的家",
            "大人和小人在山下",
            "三個人和你在家",
            "你和我有一個家",
          ];
        }
        return [
          `${char}在家`,
          `我有${char}`,
          `你有${char}`,
          `${char}在山上`,
          `${char}在山下`,
          `${char}在水上`,
          `大大的${char}`,
          `小小的${char}`,
          `你和我有${char}`,
          `有一個${char}在家`,
        ];
      }

      function generatedSentenceCandidates(choice, model) {
        return optimizeChoiceSentences(choice, model).candidates.slice(0, targetGeneratedSentenceCount);
      }

      function recentReviewSentenceCandidates(choice, existingCandidates, limit) {
        if (limit <= 0) return [];
        const model = currentModel();
        const allowedChars = unique([...model.learnedChars, ...choice.newChars]);
        const seen = new Set(existingCandidates.map((sentence) => sentence.text));
        const candidates = [];
        for (const sentence of lastLessons(model.lessons, 5).flatMap((lesson) => lesson.sentences || [])) {
          if (seen.has(sentence.text) || !sentenceAllowed(sentence.text, allowedChars)) continue;
          seen.add(sentence.text);
          candidates.push({
            text: sentence.text,
            spokenText: normalizeSpokenText(sentence.spokenText || sentence.text),
            focusChar: resolveFocusChar(sentence.text, "", choice),
            reason: "直接取自近五課已核准句，作為複習候選。",
          });
          if (candidates.length >= limit) break;
        }
        return candidates;
      }

      function replaceManualChoiceCandidates(choice, candidates) {
        const char = choice.newChars[0];
        const bankEntry = bankEntryForChar(char);
        const reviewFill = recentReviewSentenceCandidates(choice, candidates, targetReviewCandidateCount);
        const sentenceCandidates = [...candidates, ...reviewFill];
        const replacement = {
          char,
          zhuyin: choice.zhuyin?.[char] || bankEntry?.zhuyin || "",
          why: choice.rationale || bankEntry?.why || "教師用 AI 重新產生候選句。",
          sentenceCandidates,
        };
        state.manualChoices = [replacement, ...state.manualChoices.filter((entry) => entry.char !== char)];
        state.selectedIndexes.set(choice.choiceId, new Set());
        state.candidateEditingKeys = new Set([...state.candidateEditingKeys].filter((key) => !key.startsWith(`${choice.choiceId}:`)));
        state.candidateDraftsBySentence = new Map([...state.candidateDraftsBySentence].filter(([key]) => !key.startsWith(`${choice.choiceId}:`)));
        state.candidateEditsBySentence = new Map([...state.candidateEditsBySentence].filter(([key]) => !key.startsWith(`${choice.choiceId}:`)));
        state.imageNotesBySentence = new Map([...state.imageNotesBySentence].filter(([key]) => !key.startsWith(`${choice.choiceId}:`)));
        return {
          aiCount: candidates.length,
          reviewCount: reviewFill.length,
          totalCount: sentenceCandidates.length,
        };
      }

      function candidateSentence(choice, sentenceIndex) {
        const original = rawCandidateSentence(choice, sentenceIndex);
        const edit = state.candidateEditsBySentence.get(sentenceKey(choice.choiceId, sentenceIndex));
        if (!original) return null;
        const text = String(edit?.text ?? original.text ?? "");
        const spokenText = edit ? String(edit.spokenText || text) : String(original.spokenText || text);
        return {
          text,
          spokenText: normalizeSpokenText(spokenText),
          focusChar: String(edit?.focusChar ?? original.focusChar ?? ""),
          reason: edit ? `教師修改候選句。${original.reason || ""}`.trim() : String(original.reason || ""),
        };
      }

      function candidateDraft(choice, sentenceIndex) {
        const key = sentenceKey(choice.choiceId, sentenceIndex);
        const draft = state.candidateDraftsBySentence.get(key);
        if (draft) return draft;
        const sentence = candidateSentence(choice, sentenceIndex);
        return {
          text: String(sentence?.text || ""),
          spokenText: String(sentence?.spokenText || sentence?.text || ""),
          focusChar: String(sentence?.focusChar || ""),
        };
      }

      function resolveFocusChar(text, requestedFocusChar, choice) {
        const chars = hanChars(text);
        if (requestedFocusChar.trim()) return requestedFocusChar.trim();
        return choice.newChars.find((char) => chars.includes(char)) || chars[0] || "";
      }

      function withOptionalImageNotes(sentence, imageNotes) {
        const notes = String(imageNotes || "").trim();
        return notes ? { ...sentence, imageNotes: notes } : sentence;
      }

      function selectedSentences() {
        const choice = selectedChoice();
        return choice ? selectedSentencesForChoice(choice) : [];
      }

      function selectedSentencesForChoice(choice) {
        if (!choice) return [];
        const indexes = [...(state.selectedIndexes.get(choice.choiceId) || new Set())].sort((a, b) => a - b);
        const selected = indexes
          .map((index) => {
            const sentence = candidateSentence(choice, index);
            if (!sentence) return null;
            return withOptionalImageNotes(sentence, state.imageNotesBySentence.get(sentenceKey(choice.choiceId, index)));
          })
          .filter(Boolean);
        const customRows = state.customRowsByChoice.get(choice.choiceId) || [];
        const custom = customRows
          .filter((row) => row.text.trim())
          .map((row) =>
            withOptionalImageNotes(
              {
                text: row.text.trim(),
                spokenText: normalizeSpokenText(row.spokenText.trim() || row.text.trim()),
                focusChar: resolveFocusChar(row.text.trim(), row.focusChar, choice),
                reason: "教師新增句。",
              },
              row.imageNotes,
            ),
          );
        const seen = new Set();
        return [...selected, ...custom].filter((sentence) => {
          const key = `${sentence.text}\n${sentence.spokenText}`;
          if (seen.has(key)) return false;
          seen.add(key);
          return true;
        });
      }

      function reviewCharCounts(sentences, chars) {
        const counts = Object.fromEntries(chars.map((char) => [char, 0]));
        const tracked = new Set(chars);
        sentences.forEach((sentence) => {
          hanChars(sentence.text).forEach((char) => {
            if (tracked.has(char)) counts[char] += 1;
          });
        });
        return counts;
      }

      function reviewCoverageHtml(model, choice = selectedChoice()) {
        const chars = model.reviewCountChars || [];
        if (!choice || chars.length === 0) return "";
        const counts = reviewCharCounts(selectedSentencesForChoice(choice), chars);
        return `<div class="review-coverage" data-review-coverage aria-live="polite">
          <strong>近五課新字出現次數</strong>
          <div class="review-count-list">
            ${chars
              .map((char) => `<div class="review-count ${counts[char] ? "" : "zero"}">${char}<span>${counts[char] || 0}</span>次</div>`)
              .join("")}
          </div>
        </div>`;
      }

      function optimizerSummaryHtml(choice, model) {
        const metrics = choice.optimization?.metrics;
        if (!metrics) return "";
        const targetChar = choice.newChars[0];
        const missingReview = metrics.missingReviewChars || [];
        const missingRequired = metrics.missingRequiredChars || [];
        const provisionalChars = new Set([
          ...(model.provisionalReviewChars || []),
          ...(model.provisionalRequiredRecentChars || []),
        ]);
        const hardMissingReview = missingReview.filter((char) => !provisionalChars.has(char));
        const hardMissingRequired = missingRequired.filter((char) => !provisionalChars.has(char));
        const provisionalMissing = unique([...missingReview, ...missingRequired].filter((char) => provisionalChars.has(char)));
        const targetOk = metrics.targetCount >= targetNewCharCountInLesson;
        const reviewOk = hardMissingReview.length === 0;
        const requiredOk = hardMissingRequired.length === 0;
        const reviewPending = reviewOk && missingReview.length > 0;
        const requiredPending = requiredOk && missingRequired.length > 0;
        return `<div class="optimizer-summary" aria-label="課程最佳化摘要">
          <span class="optimizer-pill ${targetOk ? "" : "warning"}">${targetChar} ${metrics.targetCount}/${targetNewCharCountInLesson} 次</span>
          <span class="optimizer-pill ${reviewOk ? (reviewPending ? "pending" : "") : "warning"}">近五課 ${metrics.reviewCovered.length}/${model.reviewCountChars.length}</span>
          <span class="optimizer-pill ${requiredOk ? (requiredPending ? "pending" : "") : "warning"}">近三課 ${metrics.requiredCovered.length}/${model.requiredRecentChars.length}</span>
          ${choice.source === "manual" ? `<span class="optimizer-pill">已自審排序</span>` : ""}
          <span class="optimizer-pill">候選池 ${choice.optimization.poolSize || choice.sentenceCandidates.length} 句</span>
          ${hardMissingReview.length ? `<span class="optimizer-pill warning">缺：${hardMissingReview.join("、")}</span>` : ""}
          ${hardMissingRequired.length ? `<span class="optimizer-pill warning">近三課缺：${hardMissingRequired.join("、")}</span>` : ""}
          ${provisionalMissing.length ? `<span class="optimizer-pill pending">暫定字待補：${provisionalMissing.join("、")}</span>` : ""}
        </div>`;
      }

      function refreshReviewCoverage(model = currentModel()) {
        const coverage = document.querySelector("[data-review-coverage]");
        if (!coverage) return;
        const choice = selectedChoice();
        coverage.outerHTML = reviewCoverageHtml(model, choice);
      }

      function plannerStorageKey(model) {
        return `${plannerStoragePrefix}lesson-${model.lessonId}`;
      }

      function legacyPlannerStorageKey(model) {
        return `${plannerStoragePrefix}after-${lessonId(model.latestOrder)}`;
      }

      function savedLessonOrder(saved) {
        return Number(saved?.order) || lessonOrderFromId(saved?.lessonId);
      }

      function isNearbySavedPlanner(saved, model) {
        const order = savedLessonOrder(saved);
        return order === model.latestOrder + 1 || order === model.latestOrder + 2;
      }

      function readPlannerMemory(key) {
        try {
          return JSON.parse(localStorage.getItem(key) || "null");
        } catch {
          return null;
        }
      }

      function findPlannerMemory(model) {
        const active = readPlannerMemory(activePlannerStorageKey);
        if (active?.storageKey) {
          const activeSaved = readPlannerMemory(active.storageKey);
          if (activeSaved && isNearbySavedPlanner(activeSaved, model)) return activeSaved;
        }

        const direct = readPlannerMemory(plannerStorageKey(model));
        if (direct && isNearbySavedPlanner(direct, model)) return direct;

        const legacy = readPlannerMemory(legacyPlannerStorageKey(model));
        if (legacy && isNearbySavedPlanner(legacy, model)) return legacy;

        const nearby = [];
        try {
          for (let index = 0; index < localStorage.length; index += 1) {
            const key = localStorage.key(index);
            if (!key?.startsWith(plannerStoragePrefix) || key === activePlannerStorageKey) continue;
            const saved = readPlannerMemory(key);
            if (saved && isNearbySavedPlanner(saved, model)) nearby.push(saved);
          }
        } catch {
          return null;
        }
        return nearby.sort((a, b) => String(b.savedAt || "").localeCompare(String(a.savedAt || "")))[0] || null;
      }

      function cleanPlannedLessons(value, latestOrder) {
        const cleaned = {};
        for (const [key, plan] of Object.entries(value || {})) {
          const order = Number(plan?.order);
          if (![latestOrder + 1, latestOrder + 2].includes(order)) continue;
          const rawChars = Array.isArray(plan?.newChars) ? plan.newChars.join("") : String(plan?.newChars || "");
          const newChars = unique(hanChars(rawChars));
          if (!newChars.length) continue;
          cleaned[key] = {
            order,
            lessonId: lessonId(order),
            newChars,
            zhuyin: Object.fromEntries(newChars.map((char) => [char, String(plan?.zhuyin?.[char] || "")])),
            title: String(plan?.title || newChars.join("")),
          };
        }
        return cleaned;
      }

      function rememberPlannedChoice(model, choice) {
        if (!choice) return;
        const key = plannedLessonKey(model.order);
        state.plannedLessons = {
          ...state.plannedLessons,
          [key]: {
            order: model.order,
            lessonId: model.lessonId,
            newChars: choice.newChars,
            zhuyin: choice.zhuyin,
            title: choice.title,
          },
        };
        if (model.planOffset === 1) {
          const secondKey = plannedLessonKey(model.latestOrder + 2);
          const secondPlan = state.plannedLessons[secondKey];
          if (secondPlan && secondPlan.newChars?.some((char) => choice.newChars.includes(char))) {
            delete state.plannedLessons[secondKey];
          }
        }
      }

      function clearSelectedChoice(model = currentModel()) {
        const previousChoiceId = state.selectedChoiceId;
        delete state.plannedLessons[plannedLessonKey(model.order)];
        state.selectedChoiceId = "";
        if (state.previewChoiceId === previousChoiceId) state.previewChoiceId = "";
      }

      function mapToObject(map, valueMapper = (value) => value) {
        return Object.fromEntries([...map.entries()].map(([key, value]) => [key, valueMapper(value)]));
      }

      function restoreMapOfArrays(saved, allowedChoiceIds) {
        return new Map(
          Object.entries(saved || {})
            .filter(([choiceId]) => allowedChoiceIds.has(choiceId))
            .map(([choiceId, indexes]) => [choiceId, new Set((indexes || []).map(Number).filter(Number.isInteger))]),
        );
      }

      function restoreMapOfStrings(saved) {
        return new Map(Object.entries(saved || {}).map(([key, value]) => [key, String(value || "")]));
      }

      function restoreMapOfCandidateEdits(saved, allowedChoiceIds) {
        return new Map(
          Object.entries(saved || {})
            .filter(([key]) => allowedChoiceIds.has(key.split(":")[0]))
            .map(([key, edit]) => [
              key,
              {
                text: String(edit?.text || ""),
                spokenText: String(edit?.spokenText || ""),
                focusChar: String(edit?.focusChar || ""),
              },
            ]),
        );
      }

      function cleanSavedRows(rows) {
        return (rows || [])
          .filter((row) => row && String(row.text || "").trim())
          .map((row) => ({
            text: String(row.text || ""),
            spokenText: String(row.spokenText || ""),
            focusChar: String(row.focusChar || ""),
            imageNotes: String(row.imageNotes || ""),
            editing: Boolean(row.editing),
          }));
      }

      function restoreMapOfRows(saved, allowedChoiceIds) {
        return new Map(
          Object.entries(saved || {})
            .filter(([choiceId]) => allowedChoiceIds.has(choiceId))
            .map(([choiceId, rows]) => [choiceId, cleanSavedRows(rows)]),
        );
      }

      function restoreMapOfDrafts(saved, allowedChoiceIds) {
        return new Map(
          Object.entries(saved || {})
            .filter(([choiceId]) => allowedChoiceIds.has(choiceId))
            .map(([choiceId, draft]) => [
              choiceId,
              {
                text: String(draft?.text || ""),
                spokenText: String(draft?.spokenText || ""),
                focusChar: String(draft?.focusChar || ""),
                imageNotes: String(draft?.imageNotes || ""),
              },
            ]),
        );
      }

      function cleanManualChoices(items, learnedChars = []) {
        const learned = new Set(learnedChars);
        const seen = new Set();
        return (items || [])
          .map((item) => ({
            char: hanChars(String(item?.char || "")).join("").slice(0, 1),
            zhuyin: String(item?.zhuyin || "").trim(),
            why: String(item?.why || "").trim(),
            source: String(item?.source || ""),
            sentenceCandidates: (item?.sentenceCandidates || []).map((sentence) => ({
              text: String(sentence?.text || ""),
              spokenText: normalizeSpokenText(sentence?.spokenText || sentence?.text || ""),
              focusChar: String(sentence?.focusChar || ""),
              reason: String(sentence?.reason || ""),
            })),
          }))
          .filter((item) => {
            if (!item.char || !item.zhuyin || learned.has(item.char) || seen.has(item.char)) return false;
            seen.add(item.char);
            return true;
          });
      }

      function cleanManualDraft(draft) {
        return {
          char: String(draft?.char || ""),
          zhuyin: String(draft?.zhuyin || ""),
          why: String(draft?.why || ""),
        };
      }

      function loadPlannerMemory(model) {
        try {
          const saved = findPlannerMemory(model);
          if (!saved) return false;
          const order = savedLessonOrder(saved);
          const restoredOffset = order - model.latestOrder;
          state.planOffset = restoredOffset === 1 || restoredOffset === 2 ? restoredOffset : clampPlanOffset(saved.planOffset);
          const activeModel = recommend(state.data);
          state.storageKey = plannerStorageKey(activeModel);
          state.plannedLessons = cleanPlannedLessons(saved.plannedLessons, model.latestOrder);
          const restoredModel = recommend(state.data);
          state.manualChoices = cleanManualChoices(saved.manualChoices, restoredModel.learnedChars);
          state.manualDraft = cleanManualDraft(saved.manualDraft);
          const allowedChoiceIds = new Set([
            ...restoredModel.recommendations.map((choice) => choice.choiceId),
            ...state.manualChoices.map((choice) => `choice-${choice.char}`),
          ]);
          state.selectedChoiceId = allowedChoiceIds.has(saved.selectedChoiceId) ? saved.selectedChoiceId : "";
          state.previewChoiceId = allowedChoiceIds.has(saved.previewChoiceId) ? saved.previewChoiceId : "";
          state.selectedIndexes = restoreMapOfArrays(saved.selectedIndexes, allowedChoiceIds);
          state.candidateEditsBySentence = restoreMapOfCandidateEdits(saved.candidateEditsBySentence, allowedChoiceIds);
          state.imageNotesBySentence = restoreMapOfStrings(saved.imageNotesBySentence);
          state.customRowsByChoice = restoreMapOfRows(saved.customRowsByChoice, allowedChoiceIds);
          state.customDraftsByChoice = restoreMapOfDrafts(saved.customDraftsByChoice, allowedChoiceIds);
          savePlannerMemory(restoredModel);
          return true;
        } catch {
          return false;
        }
      }

      function savePlannerMemory(model = currentModel()) {
        state.storageKey = plannerStorageKey(model);
        const payload = {
          savedAt: new Date().toISOString(),
          order: model.order,
          lessonId: model.lessonId,
          planOffset: state.planOffset,
          plannedLessons: state.plannedLessons,
          selectedChoiceId: state.selectedChoiceId,
          previewChoiceId: state.previewChoiceId,
          selectedIndexes: mapToObject(state.selectedIndexes, (set) => [...set]),
          candidateEditsBySentence: mapToObject(state.candidateEditsBySentence),
          imageNotesBySentence: mapToObject(state.imageNotesBySentence),
          customRowsByChoice: mapToObject(state.customRowsByChoice),
          customDraftsByChoice: mapToObject(state.customDraftsByChoice),
          manualChoices: state.manualChoices,
          manualDraft: state.manualDraft,
        };
        try {
          localStorage.setItem(state.storageKey, JSON.stringify(payload));
          localStorage.setItem(
            activePlannerStorageKey,
            JSON.stringify({ storageKey: state.storageKey, lessonId: model.lessonId, savedAt: payload.savedAt }),
          );
        } catch {
          $("statusLine").textContent = "瀏覽器沒有允許儲存草稿，離開頁面前請先複製 JSON。";
        }
      }

      function clearPlannerMemory(model = currentModel()) {
        const key = plannerStorageKey(model);
        localStorage.removeItem(key);
        const active = readPlannerMemory(activePlannerStorageKey);
        if (active?.storageKey === key) localStorage.removeItem(activePlannerStorageKey);
        state.selectedChoiceId = "";
        state.previewChoiceId = "";
        state.planOffset = 1;
        state.plannedLessons = {};
        state.selectedIndexes = new Map();
        state.candidateEditsBySentence = new Map();
        state.imageNotesBySentence = new Map();
        state.customRowsByChoice = new Map();
        state.customDraftsByChoice = new Map();
        state.feedbackByChoice = new Map();
        state.manualChoices = [];
        state.manualDraft = { char: "", zhuyin: "", why: "" };
        state.storageKey = key;
      }

      function escapeAttr(value) {
        return String(value || "")
          .replaceAll("&", "&amp;")
          .replaceAll('"', "&quot;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;");
      }

      function escapeHtml(value) {
        return String(value || "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;");
      }

      function sentenceSetChars(sentences) {
        return new Set(sentences.flatMap((sentence) => hanChars(sentence.text)));
      }

      function missingRequiredRecentChars(model, sentences) {
        const used = sentenceSetChars(sentences);
        return model.requiredRecentChars.filter((char) => !used.has(char));
      }

      function buildRequest(model) {
        const choice = selectedChoice();
        const finalSentences = selectedSentences();
        if (!choice) return "";
        return JSON.stringify(buildLessonRequest(model, choice, finalSentences), null, 2);
      }

      function buildLessonRequest(model, choice, finalSentences = []) {
        const hasApprovedSentences = finalSentences.length > 0;
        const allowedChars = unique([...model.learnedChars, ...choice.newChars]);
        const missingRequired = hasApprovedSentences ? missingRequiredRecentChars(model, finalSentences) : model.requiredRecentChars;
        const dependencies = model.dependencyPlans || [];
        return {
          order: model.order,
          newChars: choice.newChars,
          zhuyin: choice.zhuyin,
          title: choice.title,
          dependsOnLessons: dependencies.map((plan) => ({
            order: plan.order,
            lessonId: lessonId(plan.order),
            newChars: plan.newChars,
            title: plan.title,
            status: "planned-not-yet-merged",
          })),
          targetSentenceCount: hasApprovedSentences ? finalSentences.length : targetGeneratedSentenceCount,
          generationConstraints: {
            sentenceHanCharLength: sentenceLengthRange,
            allowedChars,
            provisionalLearnedChars: dependencies.flatMap((plan) => plan.newChars || []),
            preferReviewChars: model.recentPool,
            mustIncludeCharsAcrossLesson: model.requiredRecentChars,
            missingRequiredCharsInCurrentSelection: missingRequired,
          },
          teacherNotes: [
            "由網頁下一課規劃工具產生。",
            `選定候選字：${choice.choiceId}。`,
            dependencies.length
              ? `平行備課依賴：本課假設 ${dependencies
                  .map((plan) => `${lessonId(plan.order)} 會加入 ${plan.newChars.join("")}`)
                  .join("；")}。可以先平行草擬，但必須等依賴課程已合併到 main 並重新匯出 planner-data 後，才可以把本課合併或推送到 main。`
              : "",
            hasApprovedSentences
              ? `核准句子：${finalSentences.map((sentence) => sentence.text).join("；")}。`
              : `尚未核准句子。請先產生 ${targetGeneratedSentenceCount} 個候選句供教師審核；教師核准句子前，不要製作正式圖片或音訊素材。`,
            `句長目標：每句 ${sentenceLengthRange.min}-${sentenceLengthRange.max} 個漢字。`,
            `優先使用最近五課複習字：${model.recentPool.join(" ")}。`,
            `整課句子中，最近三課新字至少各出現一次：${model.requiredRecentChars.join(" ")}。`,
            "只能使用已學字加上本課新字。",
            hasApprovedSentences
              ? "撰寫 imagePrompt 時，請把每一句的 imageNotes 當作教師指示。教師核准後，產生已審核的圖片提示、AI 句子音訊，以及正式可用的 AI charTimings。"
              : "草擬候選句時，句子要具體、容易配圖、符合臺灣華語自然語感，並適合幼兒。",
          ]
            .filter(Boolean)
            .join(" "),
          approvedSentences: finalSentences,
        };
      }

      function updateOutput(model) {
        const request = buildRequest(model);
        $("requestPanel").hidden = !selectedChoice();
        $("requestOutput").value = request;
        $("requestOutput").placeholder = request
          ? ""
          : "請先選一個候選字。選好後，勾選候選句或新增自己的句子，這裡才會產生 lesson request。";
      }

      function scrollSelectedChoiceIntoView() {
        window.setTimeout(() => {
          const choiceId = state.selectedChoiceId || state.previewChoiceId;
          if (!choiceId) return;
          document.querySelector(`[data-choice-card="${choiceId}"]`)?.scrollIntoView({
            behavior: "smooth",
            block: "start",
          });
        }, 0);
      }

      function requestReadinessError() {
        const model = currentModel();
        if (!selectedChoice()) return "請先選一個候選字。";
        const sentences = selectedSentences();
        if (sentences.length === 0) return "";
        const badLength = sentences.find((sentence) => {
          const length = sentenceHanLength(sentence);
          return length < sentenceLengthRange.min || length > sentenceLengthRange.max;
        });
        if (badLength) return `「${badLength.text}」不是 ${sentenceLengthRange.min}-${sentenceLengthRange.max} 個漢字，請調整句長。`;
        const missing = missingRequiredRecentChars(model, sentences);
        if (missing.length > 0) return `近三課新字還沒都出現：${missing.join("、")}。請至少各放進一句。`;
        return "";
      }

      function codexMessage(model) {
        const intro = selectedSentences().length
          ? `請依照下面 lesson request 幫我核對並製作第 ${model.order} 課。`
          : `請依照下面 lesson request 先幫我產生第 ${model.order} 課候選句，讓我審核後再製作課程。`;
        return [
          intro,
          "",
          "```json",
          buildRequest(model),
          "```",
        ].join("\n");
      }

      async function copyText(text) {
        try {
          await navigator.clipboard.writeText(text);
          return true;
        } catch {
          return false;
        }
      }

      function loadAiSettings() {
        try {
          const saved = JSON.parse(localStorage.getItem(aiSettingsStorageKey) || "{}");
          state.aiSettings = {
            endpoint: String(saved.endpoint || "").trim(),
            token: String(saved.token || ""),
          };
        } catch {
          state.aiSettings = { endpoint: "", token: "" };
        }
      }

      function saveAiSettings() {
        state.aiSettings = {
          endpoint: $("aiEndpoint").value.trim().replace(/\/+$/, ""),
          token: $("aiToken").value,
        };
        localStorage.setItem(aiSettingsStorageKey, JSON.stringify(state.aiSettings));
        renderAiSettingsForm();
      }

      function aiServiceUrl() {
        const endpoint = state.aiSettings.endpoint.replace(/\/+$/, "");
        return endpoint.endsWith("/generate-sentences") ? endpoint : `${endpoint}/generate-sentences`;
      }

      function aiRecommendationUrl() {
        const endpoint = state.aiSettings.endpoint.replace(/\/+$/, "");
        if (endpoint.endsWith("/generate-sentences")) return endpoint.replace(/\/generate-sentences$/, "/recommend-characters");
        if (endpoint.endsWith("/recommend-characters")) return endpoint;
        return `${endpoint}/recommend-characters`;
      }

      function normalizeAiSentenceCandidates(choice, allowedChars, items) {
        const targetChar = choice.newChars[0];
        const seen = new Set();
        const pool = [];
        for (const item of items || []) {
          const text = String(item?.text || "").trim();
          const chars = hanChars(text);
          if (!chars.includes(targetChar)) continue;
          if (!chars.every((char) => allowedChars.includes(char))) continue;
          if (chars.length < sentenceLengthRange.min || chars.length > sentenceLengthRange.max) continue;
          addSentenceCandidate(
            pool,
            seen,
            text,
            choice,
            allowedChars,
            String(item?.reason || "AI 生成後通過 Planner 規則檢查。"),
            String(item?.focusChar || targetChar),
          );
        }
        return pool.slice(0, targetGeneratedSentenceCount);
      }

      async function generateAiCandidates(choiceId) {
        const model = currentModel();
        const choice = choiceById(choiceId);
        if (!choice) return;
        if (!state.aiSettings.endpoint) {
          $("statusLine").textContent = "請先在 AI 句子服務填入 Cloudflare Worker URL。";
          $("aiEndpoint").focus();
          return;
        }
        if (!state.aiSettings.token) {
          $("statusLine").textContent = "請先在 AI 句子服務填入老師 token。";
          $("aiToken").focus();
          return;
        }

        state.aiGeneratingChoiceId = choiceId;
        render(model);
        $("statusLine").textContent = `正在請 AI 替「${choice.newChars.join("")}」產生候選句。`;

        let finalStatus = "";
        let shouldScrollToChoice = false;
        try {
          const lessonRequest = buildLessonRequest(model, choice, []);
          const response = await fetch(aiServiceUrl(), {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${state.aiSettings.token}`,
            },
            body: JSON.stringify({ lessonRequest }),
          });
          const payload = await response.json().catch(() => ({}));
          if (!response.ok) {
            throw new Error(payload.error || `AI 服務失敗：${response.status}`);
          }
          const allowedChars = lessonRequest.generationConstraints.allowedChars;
          const rawCandidates = payload.sentenceCandidates || payload.candidates || [];
          const candidates = normalizeAiSentenceCandidates(choice, allowedChars, rawCandidates);
          if (!candidates.length) {
            throw new Error("AI 回傳的句子沒有通過 Planner 規則檢查，請再按一次或改字。");
          }
          const replacement = replaceManualChoiceCandidates(choice, candidates);
          state.selectedChoiceId = choiceId;
          state.previewChoiceId = choiceId;
          savePlannerMemory(currentModel());
          const warningText = (payload.warnings || []).length ? ` ${payload.warnings.join(" ")}` : "";
          finalStatus = `AI 已替「${choice.newChars.join("")}」產生 ${replacement.aiCount} 句新候選，並保留 ${replacement.reviewCount} 句近五課複習候選。${warningText}`;
          shouldScrollToChoice = true;
        } catch (error) {
          const replacement = replaceManualChoiceCandidates(choice, []);
          if (replacement.reviewCount) {
            state.selectedChoiceId = choiceId;
            state.previewChoiceId = choiceId;
            savePlannerMemory(currentModel());
            finalStatus = `AI 生成失敗：${error.message} 已先保留 ${replacement.reviewCount} 句近五課複習候選，避免候選池空白。`;
            shouldScrollToChoice = true;
          } else {
            finalStatus = `AI 生成失敗：${error.message}`;
          }
        } finally {
          state.aiGeneratingChoiceId = "";
          render(currentModel());
          if (finalStatus) $("statusLine").textContent = finalStatus;
          if (shouldScrollToChoice) scrollSelectedChoiceIntoView();
        }
      }

      function buildRecommendationContext(model) {
        const previousSentences = lastLessons(model.lessons, 5).flatMap((lesson) =>
          (lesson.sentences || []).map((sentence) => sentence.text),
        );
        return {
          order: model.order,
          lessonId: model.lessonId,
          learnedChars: model.learnedChars,
          recentPool: model.recentPool,
          reviewCountChars: model.reviewCountChars,
          requiredRecentChars: model.requiredRecentChars,
          previousSentences,
          nextCharacterBank: state.data?.nextCharacterBank || [],
          count: 5,
          targetSentenceCount: targetGeneratedSentenceCount,
          sentenceHanCharLength: sentenceLengthRange,
        };
      }

      function applyAiRecommendations(items) {
        const recommendations = (items || [])
          .map((item) => {
            const char = hanChars(item?.char).join("").slice(0, 1);
            if (!char) return null;
            return {
              char,
              zhuyin: String(item?.zhuyin || zhuyinForChar(char) || ""),
              why: String(item?.why || "AI 根據目前已學字重新推薦。"),
              source: "ai-recommendation",
              sentenceCandidates: (item?.sentenceCandidates || []).map((sentence) => ({
                text: String(sentence?.text || ""),
                spokenText: normalizeSpokenText(sentence?.spokenText || sentence?.text || ""),
                focusChar: String(sentence?.focusChar || char),
                reason: String(sentence?.reason || "AI 推薦字候選句。"),
              })),
            };
          })
          .filter(Boolean);
        const recommendedChars = new Set(recommendations.map((item) => item.char));
        state.manualChoices = [
          ...recommendations,
          ...state.manualChoices.filter((entry) => entry.source !== "ai-recommendation" && !recommendedChars.has(entry.char)),
        ];
        state.selectedChoiceId = "";
        state.previewChoiceId = recommendations[0] ? `choice-${recommendations[0].char}` : "";
      }

      async function recommendAiCharacters() {
        const model = currentModel();
        if (!state.aiSettings.endpoint) {
          $("statusLine").textContent = "請先在 AI 句子服務填入 Cloudflare Worker URL。";
          $("aiEndpoint").focus();
          return;
        }
        if (!state.aiSettings.token) {
          $("statusLine").textContent = "請先在 AI 句子服務填入老師 token。";
          $("aiToken").focus();
          return;
        }
        state.aiRecommending = true;
        $("aiRecommendBtn").disabled = true;
        $("aiRecommendBtn").textContent = "AI 推薦中";
        $("statusLine").textContent = `正在請 AI 根據最新 ${model.learnedChars.length} 個已學字重新推薦新字。`;
        try {
          const response = await fetch(aiRecommendationUrl(), {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${state.aiSettings.token}`,
            },
            body: JSON.stringify({ plannerContext: buildRecommendationContext(model) }),
          });
          const payload = await response.json().catch(() => ({}));
          if (!response.ok) {
            throw new Error(payload.error || `AI 推薦失敗：${response.status}`);
          }
          applyAiRecommendations(payload.recommendations || []);
          const nextModel = currentModel();
          savePlannerMemory(nextModel);
          render(nextModel);
          $("statusLine").textContent = `AI 已根據最新課程推薦 ${payload.recommendations?.length || 0} 個新字；可展開候選句審核。`;
          scrollSelectedChoiceIntoView();
        } catch (error) {
          $("statusLine").textContent = `AI 推薦失敗：${error.message}`;
        } finally {
          state.aiRecommending = false;
          $("aiRecommendBtn").disabled = false;
          $("aiRecommendBtn").textContent = "AI 重新推薦新字";
        }
      }

      function render(model) {
        state.recommendations = model.recommendations;
        renderSummary(model);
        renderPlanSlotPanel(model);
        renderManualChoiceForm();
        renderAiSettingsForm();
        renderChoices(model);
        updateOutput(model);
      }

      async function loadData() {
        loadAiSettings();
        const response = await fetch(new URL("planner-data.json", window.location.href), { cache: "no-store" });
        if (!response.ok) throw new Error(`讀取 planner-data.json 失敗：${response.status}`);
        state.data = await response.json();
        const baseModel = recommend(state.data);
        const restored = loadPlannerMemory(baseModel);
        const model = recommend(state.data);
        render(model);
        if (restored) $("statusLine").textContent = "已恢復上次留下的本課草稿。";
      }

      function currentModel() {
        return recommend(state.data);
      }

      function bankEntryForChar(char) {
        return (state.data?.nextCharacterBank || []).find((entry) => entry.char === char) || null;
      }

      function zhuyinForChar(char) {
        return bankEntryForChar(char)?.zhuyin || fallbackZhuyinByChar[char] || "";
      }

      document.addEventListener("click", async (event) => {
        if (event.target.id === "addManualChoiceBtn") {
          const model = currentModel();
          const char = hanChars(state.manualDraft.char).join("").slice(0, 1);
          const zhuyin = state.manualDraft.zhuyin.trim() || zhuyinForChar(char);
          const why = state.manualDraft.why.trim();
          if (!char) {
            $("statusLine").textContent = "請先輸入一個新字。";
            return;
          }
          if (!zhuyin) {
            $("statusLine").textContent = `請幫「${char}」輸入注音。`;
            return;
          }
          if (model.learnedChars.includes(char)) {
            $("statusLine").textContent = `「${char}」已經學過了，不能當下一課新字。`;
            return;
          }
          const existingChoiceId = `choice-${char}`;
          const alreadyManual = state.manualChoices.some((entry) => entry.char === char);
          if (alreadyManual && model.recommendations.some((choice) => choice.choiceId === existingChoiceId)) {
            state.previewChoiceId = existingChoiceId;
            state.manualDraft = { char: "", zhuyin: "", why: "" };
            savePlannerMemory(model);
            render(model);
            $("statusLine").textContent = `「${char}」已經在自選清單，已展開自審句子。`;
            scrollSelectedChoiceIntoView();
            return;
          }
          state.manualChoices = cleanManualChoices(
            [{ char, zhuyin, why: why || "教師自行新增的下一課字。" }, ...state.manualChoices],
            model.learnedChars,
          );
          state.previewChoiceId = existingChoiceId;
          state.manualDraft = { char: "", zhuyin: "", why: "" };
          const nextModel = currentModel();
          const newChoice = nextModel.recommendations.find((choice) => choice.choiceId === existingChoiceId);
          savePlannerMemory(nextModel);
          render(nextModel);
          $("statusLine").textContent = newChoice?.sentenceCandidates?.length
            ? `已加入自選字「${char}」，可使用既有候選句，也可以按 AI 生成 10 句。`
            : `已加入自選字「${char}」。請在候選字卡片按 AI 生成 10 句，或手動新增句子。`;
          scrollSelectedChoiceIntoView();
          return;
        }

        if (event.target.id === "saveAiSettingsBtn") {
          saveAiSettings();
          $("statusLine").textContent = "AI 句子服務設定已儲存在這台裝置。";
          return;
        }

        if (event.target.id === "aiRecommendBtn") {
          await recommendAiCharacters();
          return;
        }

        const aiGenerateButton = event.target.closest("[data-ai-generate]");
        if (aiGenerateButton) {
          await generateAiCandidates(aiGenerateButton.dataset.aiGenerate);
          return;
        }

        const generateCandidatesButton = event.target.closest("[data-generate-candidates]");
        if (generateCandidatesButton) {
          const choiceId = generateCandidatesButton.dataset.generateCandidates;
          const model = currentModel();
          const choice = choiceById(choiceId);
          if (!choice) return;
          const candidates = generatedSentenceCandidates(choice, model);
          if (candidates.length === 0) {
            $("statusLine").textContent = `目前已學字還不夠，無法替「${choice.newChars.join("")}」產生可用候選句。`;
            return;
          }
          const replacement = replaceManualChoiceCandidates(choice, candidates);
          state.selectedChoiceId = choiceId;
          state.previewChoiceId = choiceId;
          savePlannerMemory(currentModel());
          render(currentModel());
          $("statusLine").textContent = `已替「${choice.newChars.join("")}」生成 ${replacement.aiCount} 句候選，並保留 ${replacement.reviewCount} 句近五課複習候選。`;
          scrollSelectedChoiceIntoView();
          return;
        }

        const previewButton = event.target.closest("[data-preview]");
        if (previewButton) {
          const choiceId = previewButton.dataset.preview;
          state.previewChoiceId = state.previewChoiceId === choiceId ? "" : choiceId;
          savePlannerMemory();
          render(currentModel());
          $("statusLine").textContent = state.previewChoiceId === choiceId ? "已展開候選句，確認後再進入編輯。" : "已收起候選句。";
          scrollSelectedChoiceIntoView();
          return;
        }

        const unselectButton = event.target.closest("[data-unselect]");
        if (unselectButton) {
          const model = currentModel();
          clearSelectedChoice(model);
          savePlannerMemory(model);
          render(model);
          $("statusLine").textContent = "已取消選字，可以重新選別的候選字。已寫好的句子草稿會保留。";
          return;
        }

        const selectButton = event.target.closest("[data-select]");
        if (selectButton) {
          state.selectedChoiceId = selectButton.dataset.select;
          state.previewChoiceId = state.selectedChoiceId;
          if (!state.selectedIndexes.has(state.selectedChoiceId)) {
            state.selectedIndexes.set(state.selectedChoiceId, new Set());
          }
          const model = currentModel();
          rememberPlannedChoice(model, selectedChoice());
          render(currentModel());
          savePlannerMemory(currentModel());
          $("statusLine").textContent = "已確定選這個字，現在可以勾選、修改或新增句子。";
          scrollSelectedChoiceIntoView();
          return;
        }

        const editCandidateButton = event.target.closest("[data-edit-candidate]");
        if (editCandidateButton) {
          const choiceId = editCandidateButton.dataset.editCandidate;
          const index = Number(editCandidateButton.dataset.index);
          const choice = choiceById(choiceId);
          const key = sentenceKey(choiceId, index);
          if (!choice) return;
          if (state.candidateEditingKeys.has(key)) {
            state.candidateEditingKeys.delete(key);
          } else {
            state.candidateDraftsBySentence.set(key, candidateDraft(choice, index));
            state.candidateEditingKeys.add(key);
          }
          state.selectedChoiceId = choiceId;
          savePlannerMemory();
          render(currentModel());
          return;
        }

        const applyCandidateButton = event.target.closest("[data-apply-candidate]");
        if (applyCandidateButton) {
          const choiceId = applyCandidateButton.dataset.applyCandidate;
          const index = Number(applyCandidateButton.dataset.index);
          const choice = choiceById(choiceId);
          const key = sentenceKey(choiceId, index);
          const draft = state.candidateDraftsBySentence.get(key);
          if (!choice || !draft) return;
          const text = draft.text.trim();
          const spokenText = normalizeSpokenText(draft.spokenText.trim() || text);
          const focusChar = resolveFocusChar(text, draft.focusChar, choice);
          if (!text) {
            $("statusLine").textContent = "請先輸入修改後的句子。";
            return;
          }
          if (focusChar && !hanChars(text).includes(focusChar)) {
            $("statusLine").textContent = `focus「${focusChar}」沒有出現在句子裡。`;
            return;
          }
          state.candidateEditsBySentence.set(key, { text, spokenText, focusChar });
          state.candidateDraftsBySentence.delete(key);
          state.candidateEditingKeys.delete(key);
          state.selectedChoiceId = choiceId;
          savePlannerMemory();
          render(currentModel());
          $("statusLine").textContent = `已套用修改：「${text}」。`;
          return;
        }

        const cancelCandidateButton = event.target.closest("[data-cancel-candidate]");
        if (cancelCandidateButton) {
          const choiceId = cancelCandidateButton.dataset.cancelCandidate;
          const index = Number(cancelCandidateButton.dataset.index);
          const key = sentenceKey(choiceId, index);
          state.candidateDraftsBySentence.delete(key);
          state.candidateEditingKeys.delete(key);
          state.selectedChoiceId = choiceId;
          savePlannerMemory();
          render(currentModel());
          return;
        }

        const resetCandidateButton = event.target.closest("[data-reset-candidate]");
        if (resetCandidateButton) {
          const choiceId = resetCandidateButton.dataset.resetCandidate;
          const index = Number(resetCandidateButton.dataset.index);
          const key = sentenceKey(choiceId, index);
          state.candidateEditsBySentence.delete(key);
          state.candidateDraftsBySentence.delete(key);
          state.candidateEditingKeys.delete(key);
          state.selectedChoiceId = choiceId;
          savePlannerMemory();
          render(currentModel());
          $("statusLine").textContent = "已還原成原本的 AI 候選句。";
          return;
        }

        const addCustomButton = event.target.closest("[data-add-custom]");
        if (addCustomButton) {
          const choiceId = addCustomButton.dataset.addCustom;
          const choice = choiceById(choiceId);
          const model = currentModel();
          const draft = draftForChoice(choiceId);
          const text = draft.text.trim();
          const spokenText = normalizeSpokenText(draft.spokenText.trim() || text);
          if (!choice) return;
          const focusChar = resolveFocusChar(text, draft.focusChar, choice);
          state.selectedChoiceId = choiceId;
          if (!text) {
            setChoiceFeedback(choiceId, "請先輸入句子。");
            savePlannerMemory(model);
            render(model);
            return;
          }
          const allowedChars = unique([...model.learnedChars, ...choice.newChars]);
          const missingChars = forbiddenChars({ text }, allowedChars);
          if (missingChars.length > 0) {
            setChoiceFeedback(choiceId, `這句有未學字：${missingChars.join("、")}。`);
            savePlannerMemory(model);
            render(model);
            return;
          }
          if (focusChar && !hanChars(text).includes(focusChar)) {
            setChoiceFeedback(choiceId, `focus「${focusChar}」沒有出現在句子裡。`);
            savePlannerMemory(model);
            render(model);
            return;
          }
          const rows = state.customRowsByChoice.get(choiceId) || [];
          rows.push({ text, spokenText, focusChar, imageNotes: draft.imageNotes.trim() });
          state.customRowsByChoice.set(choiceId, rows);
          state.customDraftsByChoice.set(choiceId, { text: "", spokenText: "", focusChar: "", imageNotes: "" });
          setChoiceFeedback(choiceId, `已新增：「${text}」。`);
          savePlannerMemory();
          render(currentModel());
          return;
        }

        const editCustomButton = event.target.closest("[data-edit-custom]");
        if (editCustomButton) {
          const choiceId = editCustomButton.dataset.editCustom;
          const index = Number(editCustomButton.dataset.custom);
          const rows = [...(state.customRowsByChoice.get(choiceId) || [])];
          if (rows[index]) rows[index] = { ...rows[index], editing: !rows[index].editing };
          state.customRowsByChoice.set(choiceId, rows);
          state.selectedChoiceId = choiceId;
          savePlannerMemory();
          render(currentModel());
          return;
        }

        const removeCustomButton = event.target.closest("[data-remove-custom]");
        if (removeCustomButton) {
          const choiceId = removeCustomButton.dataset.removeCustom;
          const index = Number(removeCustomButton.dataset.custom);
          const rows = [...(state.customRowsByChoice.get(choiceId) || [])];
          const removed = rows.splice(index, 1)[0];
          state.customRowsByChoice.set(choiceId, rows);
          state.selectedChoiceId = choiceId;
          setChoiceFeedback(choiceId, removed?.text ? `已移除：「${removed.text}」。` : "已移除一句。");
          savePlannerMemory();
          render(currentModel());
          return;
        }

        if (event.target.id === "copyBtn" || event.target.closest("[data-copy-request]")) {
          const error = requestReadinessError();
          if (error) {
            $("statusLine").textContent = error;
            return;
          }
          const copied = await copyText($("requestOutput").value);
          $("statusLine").textContent = copied ? "已複製 JSON，請貼到 Codex 對話。" : "瀏覽器沒有允許剪貼簿。請長按文字框，手動全選複製。";
          return;
        }

        if (event.target.id === "submitBtn" || event.target.closest("[data-submit-request]")) {
          const model = currentModel();
          const error = requestReadinessError();
          if (error) {
            $("statusLine").textContent = error;
            return;
          }
          const message = codexMessage(model);
          const copied = await copyText(message);
          if (navigator.share) {
            try {
              await navigator.share({ title: `${model.lessonId} lesson request`, text: message });
              $("statusLine").textContent = copied
                ? "已叫出分享面板，也已複製內容。請分享到 Codex 或貼回對話；看到 JSON 出現在對話裡才算送到。"
                : "已叫出分享面板。若分享目標沒有 Codex，請手動複製下方文字框內容；看到 JSON 出現在對話裡才算送到。";
              return;
            } catch {
              // The share panel can be canceled; the clipboard copy above is still useful.
            }
          }
          $("statusLine").textContent = copied ? "已複製可貼給 Codex 的完整內容。請回到 Codex 對話貼上；看到 JSON 出現在對話裡才算送到。" : "瀏覽器沒有允許自動複製。請長按下方文字框，手動全選複製後貼回 Codex；看到 JSON 出現在對話裡才算送到。";
          return;
        }

        if (event.target.id === "downloadBtn" || event.target.closest("[data-download-request]")) {
          const model = currentModel();
          const error = requestReadinessError();
          if (error) {
            $("statusLine").textContent = error;
            return;
          }
          const blob = new Blob([$("requestOutput").value + "\n"], { type: "application/json" });
          const link = document.createElement("a");
          link.href = URL.createObjectURL(blob);
          link.download = `${model.lessonId}.json`;
          link.click();
          URL.revokeObjectURL(link.href);
          $("statusLine").textContent = "已下載 JSON。";
          return;
        }

        if (event.target.id === "clearDraftBtn") {
          clearPlannerMemory();
          render(currentModel());
          $("statusLine").textContent = "已清除本課保留的草稿。";
          return;
        }

        if (event.target.id === "refreshBtn") {
          await loadData();
          $("statusLine").textContent = "已重新讀取資料。";
        }
      });

      document.addEventListener("change", (event) => {
        if (event.target.matches('input[name="planOffset"]')) {
          state.planOffset = clampPlanOffset(event.target.value);
          const model = currentModel();
          const plan = plannedLessonForOrder(model.order);
          const plannedChoiceId = plan ? `choice-${plan.newChars[0]}` : "";
          if (plannedChoiceId && model.recommendations.some((choice) => choice.choiceId === plannedChoiceId)) {
            state.selectedChoiceId = plannedChoiceId;
            state.previewChoiceId = plannedChoiceId;
          } else {
            state.selectedChoiceId = "";
            state.previewChoiceId = "";
          }
          savePlannerMemory(model);
          render(model);
          $("statusLine").textContent =
            state.planOffset === 2
              ? "正在規劃下下一課；會把前一槽已確定的新字當作暫定已學字。"
              : "正在規劃下一課。";
          return;
        }

        if (event.target.matches("[data-choice][data-index]")) {
          const choiceId = event.target.dataset.choice;
          const index = Number(event.target.dataset.index);
          const set = state.selectedIndexes.get(choiceId) || new Set();
          if (event.target.checked) set.add(index);
          else set.delete(index);
          state.selectedIndexes.set(choiceId, set);
          state.selectedChoiceId = choiceId;
          savePlannerMemory();
          render(currentModel());
        }
      });

      document.addEventListener("input", (event) => {
        if (event.target.id === "manualChar" || event.target.id === "manualZhuyin" || event.target.id === "manualWhy") {
          const previous = state.manualDraft;
          const next = {
            char: $("manualChar").value,
            zhuyin: $("manualZhuyin").value,
            why: $("manualWhy").value,
          };
          if (event.target.id === "manualChar") {
            const char = hanChars(next.char).join("").slice(0, 1);
            const bankEntry = bankEntryForChar(char);
            const knownZhuyin = zhuyinForChar(char);
            if (knownZhuyin) next.zhuyin = knownZhuyin;
            else if (char !== hanChars(previous.char).join("").slice(0, 1) && next.zhuyin === previous.zhuyin) next.zhuyin = "";
            if (bankEntry?.why && (!previous.why.trim() || previous.why === $("manualWhy").value)) next.why = bankEntry.why;
            state.manualDraft = next;
            renderManualChoiceForm();
          } else {
            state.manualDraft = next;
          }
          savePlannerMemory();
          return;
        }

        if (event.target.matches("[data-custom-choice][data-custom][data-field]")) {
          const choiceId = event.target.dataset.customChoice;
          const index = Number(event.target.dataset.custom);
          const field = event.target.dataset.field;
          const rows = state.customRowsByChoice.get(choiceId) || [];
          if (!rows[index]) rows[index] = { text: "", spokenText: "", focusChar: "", imageNotes: "" };
          rows[index][field] = event.target.value;
          state.customRowsByChoice.set(choiceId, rows);
          state.selectedChoiceId = choiceId;
          savePlannerMemory();
          updateOutput(currentModel());
          refreshReviewCoverage();
        }
        if (event.target.matches("[data-candidate-edit-choice][data-index][data-field]")) {
          const choiceId = event.target.dataset.candidateEditChoice;
          const index = Number(event.target.dataset.index);
          const field = event.target.dataset.field;
          const choice = choiceById(choiceId);
          const key = sentenceKey(choiceId, index);
          const draft = state.candidateDraftsBySentence.get(key) || candidateDraft(choice, index);
          draft[field] = event.target.value;
          state.candidateDraftsBySentence.set(key, draft);
          state.selectedChoiceId = choiceId;
          savePlannerMemory();
        }
        if (event.target.matches("[data-draft-choice][data-field]")) {
          const choiceId = event.target.dataset.draftChoice;
          const field = event.target.dataset.field;
          const draft = draftForChoice(choiceId);
          draft[field] = event.target.value;
          state.customDraftsByChoice.set(choiceId, draft);
          state.selectedChoiceId = choiceId;
          setChoiceFeedback(choiceId, "");
          savePlannerMemory();
          updateOutput(currentModel());
        }
        if (event.target.matches("[data-image-note-choice][data-index]")) {
          const choiceId = event.target.dataset.imageNoteChoice;
          const index = Number(event.target.dataset.index);
          state.imageNotesBySentence.set(sentenceKey(choiceId, index), event.target.value);
          state.selectedChoiceId = choiceId;
          savePlannerMemory();
          updateOutput(currentModel());
        }
      });

      loadData().catch((error) => {
        $("summaryPanel").innerHTML = `<p class="help">${error.message}</p>`;
      });
    </script>
  </body>
</html>
