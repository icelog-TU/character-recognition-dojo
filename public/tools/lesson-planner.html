<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>認字練功房｜下一課規劃工具</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #25211d;
        --muted: #6f6861;
        --line: #ddd5ca;
        --paper: #fffaf1;
        --panel: #fffdf8;
        --soft: #f5ead9;
        --primary: #19796f;
        --primary-soft: #e3f3ef;
        --accent: #f05545;
        --accent-soft: #ffe4df;
        --gold: #e8a926;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        line-height: 1.55;
      }

      button,
      input,
      textarea,
      select {
        font: inherit;
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 5;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px clamp(14px, 4vw, 28px);
        background: #ff6506;
        color: #fff;
        box-shadow: 0 8px 24px rgba(117, 65, 12, 0.18);
      }

      .brand {
        display: grid;
        gap: 2px;
      }

      .brand strong {
        font-size: clamp(1.1rem, 4vw, 1.55rem);
        line-height: 1.1;
      }

      .brand span {
        font-size: 0.86rem;
        opacity: 0.9;
      }

      .header-actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 8px;
      }

      .page {
        width: min(1120px, 100%);
        margin: 0 auto;
        padding: clamp(14px, 4vw, 28px);
      }

      .panel,
      .choice-card,
      .request-panel {
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--panel);
        box-shadow: 0 12px 28px rgba(74, 55, 32, 0.08);
      }

      .panel {
        padding: clamp(16px, 4vw, 24px);
        margin-bottom: 16px;
      }

      .summary-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
      }

      .metric {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 12px;
        background: #fff;
      }

      .metric strong {
        display: block;
        font-size: clamp(1.3rem, 5vw, 2rem);
        line-height: 1.1;
      }

      .metric span {
        color: var(--muted);
        font-size: 0.9rem;
      }

      .learned {
        margin-top: 12px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .learned span {
        min-width: 34px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        padding: 4px 8px;
        text-align: center;
        font-weight: 800;
      }

      .manual-choice-panel {
        margin-top: 14px;
        border-top: 1px solid var(--line);
        padding-top: 14px;
      }

      .manual-grid {
        display: grid;
        grid-template-columns: 0.7fr 1fr 2fr auto;
        gap: 8px;
        align-items: end;
        margin-top: 10px;
      }

      .manual-field {
        display: grid;
        gap: 4px;
      }

      .manual-field label {
        color: var(--muted);
        font-size: 0.86rem;
        font-weight: 800;
      }

      .manual-field input {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #fff;
        color: var(--ink);
        padding: 10px;
      }

      .choice-list {
        display: grid;
        gap: 14px;
      }

      .choice-card {
        padding: clamp(14px, 3vw, 20px);
      }

      .choice-card.selected {
        border-color: var(--primary);
        box-shadow: 0 0 0 5px rgba(25, 121, 111, 0.12), 0 12px 28px rgba(25, 121, 111, 0.14);
        scroll-margin-top: 116px;
      }

      .choice-card.selected::before {
        content: "目前正在編輯這個候選字";
        display: inline-flex;
        margin-bottom: 10px;
        border-radius: 999px;
        background: var(--primary-soft);
        color: var(--primary);
        padding: 4px 10px;
        font-size: 0.88rem;
        font-weight: 850;
      }

      .choice-head {
        display: grid;
        grid-template-columns: auto 1fr auto;
        align-items: center;
        gap: 12px;
      }

      .char-badge {
        display: grid;
        place-items: center;
        width: 58px;
        height: 58px;
        border-radius: 12px;
        background: var(--primary-soft);
        color: var(--primary);
        font-size: 2.2rem;
        font-weight: 900;
      }

      .choice-head h2 {
        margin: 0;
        font-size: 1.25rem;
      }

      .choice-head p,
      .sentence-row p,
      .help {
        margin: 4px 0 0;
        color: var(--muted);
      }

      .sentence-list {
        display: grid;
        gap: 8px;
        margin-top: 14px;
      }

      .custom-section {
        margin-top: 14px;
        border-top: 1px solid var(--line);
        padding-top: 14px;
      }

      .custom-section h3 {
        margin: 0;
        font-size: 1.05rem;
      }

      .draft-box {
        margin-top: 12px;
        border: 2px dashed #c9bca9;
        border-radius: 12px;
        background: #fff8ec;
        padding: 12px;
      }

      .draft-box h4,
      .added-list h4 {
        margin: 0 0 8px;
        font-size: 1rem;
      }

      .sentence-row {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 10px;
        align-items: start;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #fff;
        padding: 10px;
      }

      .sentence-row > input[type="checkbox"] {
        width: 22px;
        height: 22px;
        margin-top: 4px;
        accent-color: var(--primary);
      }

      .sentence-text {
        font-size: 1.22rem;
        font-weight: 850;
      }

      .sentence-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 6px;
        color: var(--muted);
        font-size: 0.9rem;
      }

      .pill {
        border-radius: 999px;
        background: var(--soft);
        padding: 2px 8px;
      }

      .custom-grid {
        display: grid;
        grid-template-columns: 1fr 1fr 0.4fr;
        gap: 8px;
        margin-top: 12px;
      }

      .candidate-edit-grid {
        display: grid;
        grid-template-columns: 1fr 1fr 0.4fr;
        gap: 8px;
        margin-top: 10px;
      }

      .candidate-edit-grid input {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #fff;
        color: var(--ink);
        padding: 10px;
      }

      .custom-grid input,
      .note-input,
      textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #fff;
        color: var(--ink);
        padding: 10px;
      }

      .note-input {
        min-height: 64px;
        resize: vertical;
        font-family: inherit;
        font-size: 1rem;
      }

      .custom-grid .note-input {
        grid-column: 1 / -1;
      }

      .custom-tools {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        margin-top: 10px;
      }

      .custom-feedback {
        color: var(--primary);
        font-weight: 850;
      }

      .added-list {
        display: grid;
        gap: 8px;
        margin-top: 12px;
      }

      .added-row {
        border: 2px solid rgba(25, 121, 111, 0.26);
        border-radius: 10px;
        background: #f0fbf6;
        padding: 12px;
      }

      .added-row-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 8px;
      }

      .added-sentence {
        font-size: 1.28rem;
        font-weight: 900;
      }

      .added-notes {
        margin-top: 8px;
        color: var(--muted);
      }

      .edit-fields {
        display: none;
        margin-top: 10px;
      }

      .added-row.editing .edit-fields {
        display: grid;
      }

      .request-actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-start;
        gap: 8px;
        margin-top: 10px;
      }

      .nearby-request-panel {
        margin-top: 14px;
        border: 2px solid rgba(25, 121, 111, 0.22);
        border-radius: 12px;
        background: #eefaf5;
        padding: 12px;
      }

      .nearby-request-panel h4 {
        margin: 0;
        font-size: 1rem;
      }

      .request-panel {
        margin-top: 16px;
        padding: clamp(14px, 3vw, 20px);
      }

      textarea {
        min-height: 240px;
        resize: vertical;
        font-family: Consolas, "SFMono-Regular", monospace;
        font-size: 0.88rem;
      }

      .btn {
        min-height: 42px;
        border: 0;
        border-radius: 999px;
        background: var(--primary);
        color: #fff;
        padding: 9px 14px;
        font-weight: 850;
        cursor: pointer;
      }

      .btn.secondary {
        border: 1px solid var(--line);
        background: #fff;
        color: var(--ink);
      }

      .btn.danger {
        background: var(--accent);
      }

      .btn:disabled {
        cursor: not-allowed;
        opacity: 0.5;
      }

      .status {
        margin-top: 10px;
        color: var(--primary);
        font-weight: 800;
      }

      @media (max-width: 760px) {
        .summary-grid,
        .custom-grid,
        .candidate-edit-grid,
        .manual-grid {
          grid-template-columns: 1fr;
        }

        .choice-head {
          grid-template-columns: auto 1fr;
        }

        .choice-head .btn {
          grid-column: 1 / -1;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <strong>下一課規劃工具</strong>
        <span>認字練功房｜教師用入口</span>
      </div>
      <div class="header-actions">
        <button class="btn secondary" id="refreshBtn" type="button">重新整理推薦</button>
        <a class="btn secondary" href="../">回幼兒 APP</a>
      </div>
    </header>

    <main class="page">
      <section class="panel" id="summaryPanel">
        <p class="help">正在讀取教材資料。</p>
      </section>

      <section class="panel manual-choice-panel" aria-labelledby="manualChoiceTitle">
        <h2 id="manualChoiceTitle">自選下一課字</h2>
        <p class="help">候選清單沒有你想教的字時，可以自己加入。若先不填句子，送出後會請 Codex 依規則產生候選句。</p>
        <div class="manual-grid">
          <div class="manual-field">
            <label for="manualChar">新字</label>
            <input id="manualChar" maxlength="2" inputmode="text" placeholder="在" />
          </div>
          <div class="manual-field">
            <label for="manualZhuyin">注音</label>
            <input id="manualZhuyin" inputmode="text" placeholder="ㄗㄞˋ" />
          </div>
          <div class="manual-field">
            <label for="manualWhy">理由</label>
            <input id="manualWhy" inputmode="text" placeholder="想練習位置和存在句。" />
          </div>
          <button class="btn" id="addManualChoiceBtn" type="button">加入候選字</button>
        </div>
      </section>

      <section class="choice-list" id="choiceList"></section>

      <section class="request-panel">
        <h2>完整 lesson request 預覽</h2>
        <p class="help">先選一個候選字，再勾選或新增句子。主要送出按鈕會出現在你正在編輯的候選字下面。按送出後，看到內容貼進 Codex 對話才算真的送到。</p>
        <textarea id="requestOutput" spellcheck="false"></textarea>
        <div class="request-actions">
          <button class="btn danger" id="submitBtn" type="button">送出給 Codex</button>
          <button class="btn" id="copyBtn" type="button">複製 JSON</button>
          <button class="btn secondary" id="downloadBtn" type="button">下載 JSON</button>
          <button class="btn secondary" id="clearDraftBtn" type="button">清除本課草稿</button>
        </div>
        <div class="status" id="statusLine"></div>
      </section>
    </main>

    <script>
      const state = {
        data: null,
        recommendations: [],
        selectedChoiceId: "",
        storageKey: "",
        selectedIndexes: new Map(),
        candidateEditsBySentence: new Map(),
        imageNotesBySentence: new Map(),
        customRowsByChoice: new Map(),
        customDraftsByChoice: new Map(),
        feedbackByChoice: new Map(),
        manualChoices: [],
        manualDraft: { char: "", zhuyin: "", why: "" },
      };

      const sentenceLengthRange = { min: 4, max: 12 };
      const targetGeneratedSentenceCount = 10;
      const $ = (id) => document.getElementById(id);

      function hanChars(text) {
        return Array.from(text || "").filter((char) => /\p{Script=Han}/u.test(char));
      }

      function unique(items) {
        return [...new Set(items)];
      }

      function lessonId(order) {
        return `L${String(order).padStart(3, "0")}`;
      }

      function lastLessons(lessons, count) {
        return [...lessons].sort((a, b) => a.order - b.order).slice(-count);
      }

      function recentReviewPool(lessons) {
        return unique(
          lastLessons(lessons, 5).flatMap((lesson) =>
            (lesson.sentences || []).flatMap((sentence) => hanChars(sentence.text)),
          ),
        );
      }

      function previousLessonNewChars(lessons, count) {
        return unique(lastLessons(lessons, count).flatMap((lesson) => lesson.newChars || []));
      }

      function sentenceHanLength(sentence) {
        return hanChars(sentence.text).length;
      }

      function forbiddenChars(sentence, allowedChars) {
        const allowed = new Set(allowedChars);
        return unique(hanChars(sentence.text).filter((char) => !allowed.has(char)));
      }

      function cleanSentences(sentences, allowedChars) {
        return (sentences || [])
          .map((sentence) => ({
            text: String(sentence.text || ""),
            spokenText: String(sentence.spokenText || sentence.text || "").replace(/[，。！？、,.!?]/g, ""),
            focusChar: String(sentence.focusChar || ""),
            reason: String(sentence.reason || ""),
          }))
          .filter((sentence) => {
            const length = sentenceHanLength(sentence);
            return (
              sentence.text &&
              forbiddenChars(sentence, allowedChars).length === 0 &&
              length >= sentenceLengthRange.min &&
              length <= sentenceLengthRange.max
            );
          });
      }

      function scoreCandidate(entry, learnedChars, recentPool) {
        const learned = new Set(learnedChars);
        const requiredMissing = (entry.requires || []).filter((char) => !learned.has(char));
        if (requiredMissing.length > 0 || learned.has(entry.char)) return null;
        const recent = new Set(recentPool);
        const sentenceChars = unique((entry.sentenceCandidates || []).flatMap((sentence) => hanChars(sentence.text)));
        const reviewHits = sentenceChars.filter((char) => recent.has(char)).length;
        return Number(entry.priority || 1000) - reviewHits * 2;
      }

      function recommend(data) {
        const lessons = [...(data.lessons || [])].sort((a, b) => a.order - b.order);
        const latestOrder = Math.max(...lessons.map((lesson) => lesson.order));
        const order = latestOrder + 1;
        const learnedChars = unique(lessons.flatMap((lesson) => lesson.newChars || []));
        const recentPool = recentReviewPool(lessons);
        const requiredRecentChars = previousLessonNewChars(lessons, 3);
        const bankEntries = data.nextCharacterBank || [];
        const bankChars = new Set(bankEntries.map((entry) => entry.char));
        const manualEntries = state.manualChoices
          .filter((entry) => entry.char && !bankChars.has(entry.char))
          .map((entry, index) => ({
            char: entry.char,
            zhuyin: entry.zhuyin,
            priority: 5 + index,
            why: entry.why || "Teacher-added next character.",
            requires: [],
            sentenceCandidates: [],
            source: "manual",
          }));
        const recommendations = [...manualEntries, ...bankEntries]
          .map((entry) => {
            const score = scoreCandidate(entry, learnedChars, recentPool);
            if (score === null) return null;
            const allowedChars = unique([...learnedChars, entry.char]);
            return {
              choiceId: `choice-${entry.char}`,
              newChars: [entry.char],
              zhuyin: { [entry.char]: entry.zhuyin },
              title: entry.char,
              rationale: entry.why,
              score,
              source: entry.source || "bank",
              sentenceCandidates: cleanSentences(entry.sentenceCandidates, allowedChars),
            };
          })
          .filter(Boolean)
          .sort((a, b) => a.score - b.score)
          .slice(0, 6);
        return { lessons, latestOrder, order, lessonId: lessonId(order), learnedChars, recentPool, requiredRecentChars, recommendations };
      }

      function renderSummary(model) {
        $("summaryPanel").innerHTML = `
          <div class="summary-grid">
            <div class="metric"><strong>${model.lessonId}</strong><span>下一課</span></div>
            <div class="metric"><strong>${model.learnedChars.length}</strong><span>已學漢字</span></div>
            <div class="metric"><strong>${model.latestOrder}</strong><span>目前課數</span></div>
            <div class="metric"><strong>${model.recommendations.length}</strong><span>候選字</span></div>
          </div>
          <p class="help">資料匯出時間：${state.data.exportedAt || "未知"}</p>
          <p class="help">造句規則：每句 ${sentenceLengthRange.min}-${sentenceLengthRange.max} 個漢字；優先使用近 5 課字；近 3 課新字 ${model.requiredRecentChars.join("、")} 在整課句子中至少各出現一次。</p>
          <div class="learned">${model.learnedChars.map((char) => `<span>${char}</span>`).join("")}</div>
        `;
      }

      function renderManualChoiceForm() {
        $("manualChar").value = state.manualDraft.char;
        $("manualZhuyin").value = state.manualDraft.zhuyin;
        $("manualWhy").value = state.manualDraft.why;
      }

      function renderChoices(model) {
        const originalRanks = new Map(model.recommendations.map((choice, index) => [choice.choiceId, index + 1]));
        const orderedRecommendations = [...model.recommendations].sort((a, b) => {
          if (a.choiceId === state.selectedChoiceId) return -1;
          if (b.choiceId === state.selectedChoiceId) return 1;
          return (originalRanks.get(a.choiceId) || 0) - (originalRanks.get(b.choiceId) || 0);
        });
        $("choiceList").innerHTML = orderedRecommendations
          .map((choice, choiceIndex) => {
            const selected = choice.choiceId === state.selectedChoiceId;
            const customRows = state.customRowsByChoice.get(choice.choiceId) || [];
            const draft = state.customDraftsByChoice.get(choice.choiceId) || { text: "", spokenText: "", focusChar: "", imageNotes: "" };
            const feedback = state.feedbackByChoice.get(choice.choiceId) || "";
            return `
              <article class="choice-card ${selected ? "selected" : ""}" data-choice-card="${choice.choiceId}">
                <div class="choice-head">
                  <div class="char-badge">${choice.newChars.join("")}</div>
                  <div>
                    <h2>${selected ? "已選" : `${originalRanks.get(choice.choiceId) || choiceIndex + 1}.`} ${choice.newChars.join("")} ${Object.values(choice.zhuyin).join(" ")}</h2>
                    <p>${choice.rationale}</p>
                  </div>
                  <button class="btn ${selected ? "secondary" : ""}" type="button" data-select="${choice.choiceId}">
                    ${selected ? "已選這個字" : "選這個字"}
                  </button>
                </div>
                <div class="sentence-list">
                  ${
                    choice.sentenceCandidates.length
                      ? choice.sentenceCandidates
                          .map((sentence, sentenceIndex) => {
                            const checked = state.selectedIndexes.get(choice.choiceId)?.has(sentenceIndex) || false;
                            const editedSentence = candidateSentence(choice, sentenceIndex);
                            const imageNotes = state.imageNotesBySentence.get(sentenceKey(choice.choiceId, sentenceIndex)) || "";
                            return `
                              <div class="sentence-row">
                                <input type="checkbox" data-choice="${choice.choiceId}" data-index="${sentenceIndex}" ${checked ? "checked" : ""} />
                                <div>
                                  <div class="sentence-text">${escapeHtml(editedSentence.text)}</div>
                                  <div class="sentence-meta">
                                    <span class="pill">spoken: ${escapeHtml(editedSentence.spokenText)}</span>
                                    <span class="pill">focus: ${escapeHtml(editedSentence.focusChar)}</span>
                                  </div>
                                  <p>${sentence.reason}</p>
                                  <div class="candidate-edit-grid">
                                    <input aria-label="候選句文字" placeholder="句子" value="${escapeAttr(editedSentence.text)}" data-candidate-edit-choice="${choice.choiceId}" data-index="${sentenceIndex}" data-field="text" />
                                    <input aria-label="候選句 spokenText" placeholder="spokenText，可留空" value="${escapeAttr(editedSentence.spokenText)}" data-candidate-edit-choice="${choice.choiceId}" data-index="${sentenceIndex}" data-field="spokenText" />
                                    <input aria-label="候選句 focus" placeholder="focus" value="${escapeAttr(editedSentence.focusChar)}" data-candidate-edit-choice="${choice.choiceId}" data-index="${sentenceIndex}" data-field="focusChar" />
                                  </div>
                                  <textarea class="note-input" aria-label="候選句配圖要求" placeholder="配圖要求，可留空。例如：畫面要清楚看出二大一小，不要有文字。" data-image-note-choice="${choice.choiceId}" data-index="${sentenceIndex}">${escapeHtml(imageNotes)}</textarea>
                                </div>
                              </div>
                            `;
                          })
                          .join("")
                      : `<div class="sentence-row">
                          <div></div>
                          <div>
                            <div class="sentence-text">還沒有候選句</div>
                            <p>可以自己新增句子；也可以先送出給 Codex，請 Codex 依 4-12 字、近 5 課優先、近 3 課必用的規則產生候選句。</p>
                          </div>
                        </div>`
                  }
                </div>
                <section class="custom-section">
                  <h3>新增給「${choice.newChars.join("")}」的句子</h3>
                  <p class="help">先在下面輸入一句，再按「新增這句」。新增後會出現在已新增清單，也會同步進入最下面的 lesson request。</p>
                  ${
                    customRows.length
                      ? `<div class="added-list">
                          <h4>已新增成功的句子</h4>
                          ${customRows
                            .map(
                              (row, index) => `
                                <div class="added-row ${row.editing ? "editing" : ""}">
                                  <div class="added-row-head">
                                    <span class="pill">完成第 ${index + 1} 句</span>
                                    <div class="header-actions">
                                      <button class="btn secondary" type="button" data-edit-custom="${choice.choiceId}" data-custom="${index}">${row.editing ? "收起編輯" : "編輯"}</button>
                                      <button class="btn secondary" type="button" data-remove-custom="${choice.choiceId}" data-custom="${index}">移除</button>
                                    </div>
                                  </div>
                                  <div class="added-sentence">${escapeHtml(row.text)}</div>
                                  <div class="sentence-meta">
                                    <span class="pill">spoken: ${escapeHtml(row.spokenText || row.text)}</span>
                                    <span class="pill">focus: ${escapeHtml(row.focusChar || resolveFocusChar(row.text, "", choice))}</span>
                                  </div>
                                  ${
                                    row.imageNotes
                                      ? `<div class="added-notes"><strong>配圖要求：</strong>${escapeHtml(row.imageNotes)}</div>`
                                      : ""
                                  }
                                  <div class="custom-grid edit-fields">
                                    <input aria-label="已新增句子" placeholder="句子" value="${escapeAttr(row.text)}" data-custom-choice="${choice.choiceId}" data-custom="${index}" data-field="text" />
                                    <input aria-label="已新增 spokenText" placeholder="spokenText，可留空" value="${escapeAttr(row.spokenText)}" data-custom-choice="${choice.choiceId}" data-custom="${index}" data-field="spokenText" />
                                    <input aria-label="已新增 focus" placeholder="focus" value="${escapeAttr(row.focusChar)}" data-custom-choice="${choice.choiceId}" data-custom="${index}" data-field="focusChar" />
                                    <textarea class="note-input" aria-label="已新增配圖要求" placeholder="配圖要求，可留空" data-custom-choice="${choice.choiceId}" data-custom="${index}" data-field="imageNotes">${escapeHtml(row.imageNotes)}</textarea>
                                  </div>
                                </div>
                              `,
                            )
                            .join("")}
                        </div>`
                      : ""
                  }
                  <div class="draft-box">
                    <h4>輸入新句子</h4>
                    <div class="custom-grid">
                      <input aria-label="新句子" placeholder="句子，例如：你有小小的手" value="${escapeAttr(draft.text)}" data-draft-choice="${choice.choiceId}" data-field="text" />
                      <input aria-label="新句子 spokenText" placeholder="spokenText，可留空" value="${escapeAttr(draft.spokenText)}" data-draft-choice="${choice.choiceId}" data-field="spokenText" />
                      <input aria-label="新句子 focus" placeholder="focus，可留空" value="${escapeAttr(draft.focusChar)}" data-draft-choice="${choice.choiceId}" data-field="focusChar" />
                      <textarea class="note-input" aria-label="新句子配圖要求" placeholder="配圖要求，可留空。例如：山要有三座，角色不要太小。" data-draft-choice="${choice.choiceId}" data-field="imageNotes">${escapeHtml(draft.imageNotes)}</textarea>
                    </div>
                    <div class="custom-tools">
                      <button class="btn secondary" type="button" data-add-custom="${choice.choiceId}">新增這句</button>
                      <span class="custom-feedback">${escapeHtml(feedback)}</span>
                    </div>
                  </div>
                  ${
                    selected
                      ? `<div class="nearby-request-panel">
                          <h4>送出這一課</h4>
                          <p class="help">句子都確認後，從這裡就近複製或分享給 Codex。這個網頁不會直接連到 Codex，看到內容貼進對話才算送出。</p>
                          <div class="request-actions">
                            <button class="btn danger" type="button" data-submit-request>送出給 Codex</button>
                            <button class="btn" type="button" data-copy-request>複製 JSON</button>
                            <button class="btn secondary" type="button" data-download-request>下載 JSON</button>
                          </div>
                        </div>`
                      : ""
                  }
                </section>
              </article>
            `;
          })
          .join("");
      }

      function selectedChoice() {
        return state.recommendations.find((choice) => choice.choiceId === state.selectedChoiceId);
      }

      function choiceById(choiceId) {
        return state.recommendations.find((choice) => choice.choiceId === choiceId);
      }

      function draftForChoice(choiceId) {
        const draft = state.customDraftsByChoice.get(choiceId) || { text: "", spokenText: "", focusChar: "", imageNotes: "" };
        state.customDraftsByChoice.set(choiceId, draft);
        return draft;
      }

      function setChoiceFeedback(choiceId, message) {
        state.feedbackByChoice.set(choiceId, message);
      }

      function sentenceKey(choiceId, sentenceIndex) {
        return `${choiceId}:${sentenceIndex}`;
      }

      function candidateSentence(choice, sentenceIndex) {
        const original = choice.sentenceCandidates[sentenceIndex];
        const edit = state.candidateEditsBySentence.get(sentenceKey(choice.choiceId, sentenceIndex));
        if (!original) return null;
        const text = String(edit?.text ?? original.text ?? "");
        const spokenText = edit ? String(edit.spokenText || text) : String(original.spokenText || text);
        return {
          text,
          spokenText: spokenText.replace(/[，。！？、,.!?]/g, ""),
          focusChar: String(edit?.focusChar ?? original.focusChar ?? ""),
          reason: edit ? `Teacher-edited candidate. ${original.reason || ""}`.trim() : String(original.reason || ""),
        };
      }

      function resolveFocusChar(text, requestedFocusChar, choice) {
        const chars = hanChars(text);
        if (requestedFocusChar.trim()) return requestedFocusChar.trim();
        return choice.newChars.find((char) => chars.includes(char)) || chars[0] || "";
      }

      function withOptionalImageNotes(sentence, imageNotes) {
        const notes = String(imageNotes || "").trim();
        return notes ? { ...sentence, imageNotes: notes } : sentence;
      }

      function selectedSentences() {
        const choice = selectedChoice();
        if (!choice) return [];
        const indexes = [...(state.selectedIndexes.get(choice.choiceId) || new Set())].sort((a, b) => a - b);
        const selected = indexes
          .map((index) => {
            const sentence = candidateSentence(choice, index);
            if (!sentence) return null;
            return withOptionalImageNotes(sentence, state.imageNotesBySentence.get(sentenceKey(choice.choiceId, index)));
          })
          .filter(Boolean);
        const customRows = state.customRowsByChoice.get(choice.choiceId) || [];
        const custom = customRows
          .filter((row) => row.text.trim())
          .map((row) =>
            withOptionalImageNotes(
              {
                text: row.text.trim(),
                spokenText: (row.spokenText.trim() || row.text.trim()).replace(/[，。！？、,.!?]/g, ""),
                focusChar: resolveFocusChar(row.text.trim(), row.focusChar, choice),
                reason: "Teacher-added sentence.",
              },
              row.imageNotes,
            ),
          );
        const seen = new Set();
        return [...selected, ...custom].filter((sentence) => {
          const key = `${sentence.text}\n${sentence.spokenText}`;
          if (seen.has(key)) return false;
          seen.add(key);
          return true;
        });
      }

      function plannerStorageKey(model) {
        return `character-recognition-dojo:lesson-planner:v1:${model.lessonId}`;
      }

      function mapToObject(map, valueMapper = (value) => value) {
        return Object.fromEntries([...map.entries()].map(([key, value]) => [key, valueMapper(value)]));
      }

      function restoreMapOfArrays(saved, allowedChoiceIds) {
        return new Map(
          Object.entries(saved || {})
            .filter(([choiceId]) => allowedChoiceIds.has(choiceId))
            .map(([choiceId, indexes]) => [choiceId, new Set((indexes || []).map(Number).filter(Number.isInteger))]),
        );
      }

      function restoreMapOfStrings(saved) {
        return new Map(Object.entries(saved || {}).map(([key, value]) => [key, String(value || "")]));
      }

      function restoreMapOfCandidateEdits(saved, allowedChoiceIds) {
        return new Map(
          Object.entries(saved || {})
            .filter(([key]) => allowedChoiceIds.has(key.split(":")[0]))
            .map(([key, edit]) => [
              key,
              {
                text: String(edit?.text || ""),
                spokenText: String(edit?.spokenText || ""),
                focusChar: String(edit?.focusChar || ""),
              },
            ]),
        );
      }

      function cleanSavedRows(rows) {
        return (rows || [])
          .filter((row) => row && String(row.text || "").trim())
          .map((row) => ({
            text: String(row.text || ""),
            spokenText: String(row.spokenText || ""),
            focusChar: String(row.focusChar || ""),
            imageNotes: String(row.imageNotes || ""),
            editing: Boolean(row.editing),
          }));
      }

      function restoreMapOfRows(saved, allowedChoiceIds) {
        return new Map(
          Object.entries(saved || {})
            .filter(([choiceId]) => allowedChoiceIds.has(choiceId))
            .map(([choiceId, rows]) => [choiceId, cleanSavedRows(rows)]),
        );
      }

      function restoreMapOfDrafts(saved, allowedChoiceIds) {
        return new Map(
          Object.entries(saved || {})
            .filter(([choiceId]) => allowedChoiceIds.has(choiceId))
            .map(([choiceId, draft]) => [
              choiceId,
              {
                text: String(draft?.text || ""),
                spokenText: String(draft?.spokenText || ""),
                focusChar: String(draft?.focusChar || ""),
                imageNotes: String(draft?.imageNotes || ""),
              },
            ]),
        );
      }

      function cleanManualChoices(items, learnedChars = []) {
        const learned = new Set(learnedChars);
        const seen = new Set();
        return (items || [])
          .map((item) => ({
            char: hanChars(String(item?.char || "")).join("").slice(0, 1),
            zhuyin: String(item?.zhuyin || "").trim(),
            why: String(item?.why || "").trim(),
          }))
          .filter((item) => {
            if (!item.char || !item.zhuyin || learned.has(item.char) || seen.has(item.char)) return false;
            seen.add(item.char);
            return true;
          });
      }

      function cleanManualDraft(draft) {
        return {
          char: String(draft?.char || ""),
          zhuyin: String(draft?.zhuyin || ""),
          why: String(draft?.why || ""),
        };
      }

      function loadPlannerMemory(model) {
        state.storageKey = plannerStorageKey(model);
        try {
          const saved = JSON.parse(localStorage.getItem(state.storageKey) || "null");
          if (!saved) return false;
          state.manualChoices = cleanManualChoices(saved.manualChoices, model.learnedChars);
          state.manualDraft = cleanManualDraft(saved.manualDraft);
          const allowedChoiceIds = new Set([
            ...model.recommendations.map((choice) => choice.choiceId),
            ...state.manualChoices.map((choice) => `choice-${choice.char}`),
          ]);
          state.selectedChoiceId = allowedChoiceIds.has(saved.selectedChoiceId) ? saved.selectedChoiceId : "";
          state.selectedIndexes = restoreMapOfArrays(saved.selectedIndexes, allowedChoiceIds);
          state.candidateEditsBySentence = restoreMapOfCandidateEdits(saved.candidateEditsBySentence, allowedChoiceIds);
          state.imageNotesBySentence = restoreMapOfStrings(saved.imageNotesBySentence);
          state.customRowsByChoice = restoreMapOfRows(saved.customRowsByChoice, allowedChoiceIds);
          state.customDraftsByChoice = restoreMapOfDrafts(saved.customDraftsByChoice, allowedChoiceIds);
          return true;
        } catch {
          return false;
        }
      }

      function savePlannerMemory(model = currentModel()) {
        if (!state.storageKey) state.storageKey = plannerStorageKey(model);
        const payload = {
          savedAt: new Date().toISOString(),
          lessonId: model.lessonId,
          selectedChoiceId: state.selectedChoiceId,
          selectedIndexes: mapToObject(state.selectedIndexes, (set) => [...set]),
          candidateEditsBySentence: mapToObject(state.candidateEditsBySentence),
          imageNotesBySentence: mapToObject(state.imageNotesBySentence),
          customRowsByChoice: mapToObject(state.customRowsByChoice),
          customDraftsByChoice: mapToObject(state.customDraftsByChoice),
          manualChoices: state.manualChoices,
          manualDraft: state.manualDraft,
        };
        try {
          localStorage.setItem(state.storageKey, JSON.stringify(payload));
        } catch {
          $("statusLine").textContent = "瀏覽器沒有允許儲存草稿，離開頁面前請先複製 JSON。";
        }
      }

      function clearPlannerMemory(model = currentModel()) {
        const key = state.storageKey || plannerStorageKey(model);
        localStorage.removeItem(key);
        state.selectedChoiceId = "";
        state.selectedIndexes = new Map();
        state.candidateEditsBySentence = new Map();
        state.imageNotesBySentence = new Map();
        state.customRowsByChoice = new Map();
        state.customDraftsByChoice = new Map();
        state.feedbackByChoice = new Map();
        state.manualChoices = [];
        state.manualDraft = { char: "", zhuyin: "", why: "" };
        state.storageKey = key;
      }

      function escapeAttr(value) {
        return String(value || "")
          .replaceAll("&", "&amp;")
          .replaceAll('"', "&quot;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;");
      }

      function escapeHtml(value) {
        return String(value || "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;");
      }

      function sentenceSetChars(sentences) {
        return new Set(sentences.flatMap((sentence) => hanChars(sentence.text)));
      }

      function missingRequiredRecentChars(model, sentences) {
        const used = sentenceSetChars(sentences);
        return model.requiredRecentChars.filter((char) => !used.has(char));
      }

      function buildRequest(model) {
        const choice = selectedChoice();
        const finalSentences = selectedSentences();
        if (!choice) return "";
        const hasApprovedSentences = finalSentences.length > 0;
        const allowedChars = unique([...model.learnedChars, ...choice.newChars]);
        const missingRequired = hasApprovedSentences ? missingRequiredRecentChars(model, finalSentences) : model.requiredRecentChars;
        return JSON.stringify(
          {
            order: model.order,
            newChars: choice.newChars,
            zhuyin: choice.zhuyin,
            title: choice.title,
            targetSentenceCount: hasApprovedSentences ? finalSentences.length : targetGeneratedSentenceCount,
            generationConstraints: {
              sentenceHanCharLength: sentenceLengthRange,
              allowedChars,
              preferReviewChars: model.recentPool,
              mustIncludeCharsAcrossLesson: model.requiredRecentChars,
              missingRequiredCharsInCurrentSelection: missingRequired,
            },
            teacherNotes: [
              "Generated from the web next-lesson planner.",
              `Selected choice: ${choice.choiceId}.`,
              hasApprovedSentences
                ? `Approved sentences: ${finalSentences.map((sentence) => sentence.text).join("; ")}.`
                : `No approved sentences yet. First generate ${targetGeneratedSentenceCount} sentence candidates for teacher review; do not build production image/audio assets until the teacher approves sentences.`,
              `Sentence length target: ${sentenceLengthRange.min}-${sentenceLengthRange.max} Han characters per sentence.`,
              `Prefer using recent review characters from the previous five lessons: ${model.recentPool.join(" ")}.`,
              `Across this lesson's sentence set, include each new character from the previous three lessons at least once: ${model.requiredRecentChars.join(" ")}.`,
              "Use only learned characters plus the new character(s).",
              hasApprovedSentences
                ? "Use each sentence's imageNotes as teacher guidance when writing imagePrompt. Generate reviewed image prompts, AI sentence audio, and production AI charTimings after teacher approval."
                : "When drafting candidates, keep them concrete, imageable, natural in Taiwan Mandarin, and suitable for young children.",
            ].join(" "),
            approvedSentences: finalSentences,
          },
          null,
          2,
        );
      }

      function updateOutput(model) {
        const request = buildRequest(model);
        $("requestOutput").value = request;
        $("requestOutput").placeholder = request
          ? ""
          : "請先選一個候選字。選好後，勾選候選句或新增自己的句子，這裡才會產生 lesson request。";
      }

      function scrollSelectedChoiceIntoView() {
        window.setTimeout(() => {
          document.querySelector(`[data-choice-card="${state.selectedChoiceId}"]`)?.scrollIntoView({
            behavior: "smooth",
            block: "start",
          });
        }, 0);
      }

      function requestReadinessError() {
        const model = currentModel();
        if (!selectedChoice()) return "請先選一個候選字。";
        const sentences = selectedSentences();
        if (sentences.length === 0) return "";
        const badLength = sentences.find((sentence) => {
          const length = sentenceHanLength(sentence);
          return length < sentenceLengthRange.min || length > sentenceLengthRange.max;
        });
        if (badLength) return `「${badLength.text}」不是 ${sentenceLengthRange.min}-${sentenceLengthRange.max} 個漢字，請調整句長。`;
        const missing = missingRequiredRecentChars(model, sentences);
        if (missing.length > 0) return `近三課新字還沒都出現：${missing.join("、")}。請至少各放進一句。`;
        return "";
      }

      function codexMessage(model) {
        const intro = selectedSentences().length
          ? `請依照下面 lesson request 幫我核對並製作第 ${model.order} 課。`
          : `請依照下面 lesson request 先幫我產生第 ${model.order} 課候選句，讓我審核後再製作課程。`;
        return [
          intro,
          "",
          "```json",
          buildRequest(model),
          "```",
        ].join("\n");
      }

      async function copyText(text) {
        try {
          await navigator.clipboard.writeText(text);
          return true;
        } catch {
          return false;
        }
      }

      function render(model) {
        state.recommendations = model.recommendations;
        renderSummary(model);
        renderManualChoiceForm();
        renderChoices(model);
        updateOutput(model);
      }

      async function loadData() {
        const response = await fetch(new URL("planner-data.json", window.location.href), { cache: "no-store" });
        if (!response.ok) throw new Error(`讀取 planner-data.json 失敗：${response.status}`);
        state.data = await response.json();
        const baseModel = recommend(state.data);
        const restored = loadPlannerMemory(baseModel);
        const model = recommend(state.data);
        render(model);
        if (restored) $("statusLine").textContent = "已恢復上次留下的本課草稿。";
      }

      function currentModel() {
        return recommend(state.data);
      }

      document.addEventListener("click", async (event) => {
        if (event.target.id === "addManualChoiceBtn") {
          const model = currentModel();
          const char = hanChars(state.manualDraft.char).join("").slice(0, 1);
          const zhuyin = state.manualDraft.zhuyin.trim();
          const why = state.manualDraft.why.trim();
          if (!char) {
            $("statusLine").textContent = "請先輸入一個新字。";
            return;
          }
          if (!zhuyin) {
            $("statusLine").textContent = `請幫「${char}」輸入注音。`;
            return;
          }
          if (model.learnedChars.includes(char)) {
            $("statusLine").textContent = `「${char}」已經學過了，不能當下一課新字。`;
            return;
          }
          const existingChoiceId = `choice-${char}`;
          if (model.recommendations.some((choice) => choice.choiceId === existingChoiceId)) {
            state.selectedChoiceId = existingChoiceId;
            state.manualDraft = { char: "", zhuyin: "", why: "" };
            savePlannerMemory(model);
            render(model);
            $("statusLine").textContent = `「${char}」已經在候選清單，已移到上方。`;
            scrollSelectedChoiceIntoView();
            return;
          }
          state.manualChoices = cleanManualChoices(
            [{ char, zhuyin, why: why || "Teacher-added next character." }, ...state.manualChoices],
            model.learnedChars,
          );
          state.selectedChoiceId = existingChoiceId;
          state.manualDraft = { char: "", zhuyin: "", why: "" };
          const nextModel = currentModel();
          savePlannerMemory(nextModel);
          render(nextModel);
          $("statusLine").textContent = `已加入自選字「${char}」，可以新增句子或先請 Codex 造候選句。`;
          scrollSelectedChoiceIntoView();
          return;
        }

        const selectButton = event.target.closest("[data-select]");
        if (selectButton) {
          state.selectedChoiceId = selectButton.dataset.select;
          if (!state.selectedIndexes.has(state.selectedChoiceId)) {
            state.selectedIndexes.set(state.selectedChoiceId, new Set());
          }
          render(currentModel());
          savePlannerMemory();
          $("statusLine").textContent = "已選這個字，候選卡已移到上方。";
          scrollSelectedChoiceIntoView();
          return;
        }

        const addCustomButton = event.target.closest("[data-add-custom]");
        if (addCustomButton) {
          const choiceId = addCustomButton.dataset.addCustom;
          const choice = choiceById(choiceId);
          const model = currentModel();
          const draft = draftForChoice(choiceId);
          const text = draft.text.trim();
          const spokenText = (draft.spokenText.trim() || text).replace(/[，。！？、,.!?]/g, "");
          if (!choice) return;
          const focusChar = resolveFocusChar(text, draft.focusChar, choice);
          state.selectedChoiceId = choiceId;
          if (!text) {
            setChoiceFeedback(choiceId, "請先輸入句子。");
            savePlannerMemory(model);
            render(model);
            return;
          }
          const allowedChars = unique([...model.learnedChars, ...choice.newChars]);
          const missingChars = forbiddenChars({ text }, allowedChars);
          if (missingChars.length > 0) {
            setChoiceFeedback(choiceId, `這句有未學字：${missingChars.join("、")}。`);
            savePlannerMemory(model);
            render(model);
            return;
          }
          if (focusChar && !hanChars(text).includes(focusChar)) {
            setChoiceFeedback(choiceId, `focus「${focusChar}」沒有出現在句子裡。`);
            savePlannerMemory(model);
            render(model);
            return;
          }
          const rows = state.customRowsByChoice.get(choiceId) || [];
          rows.push({ text, spokenText, focusChar, imageNotes: draft.imageNotes.trim() });
          state.customRowsByChoice.set(choiceId, rows);
          state.customDraftsByChoice.set(choiceId, { text: "", spokenText: "", focusChar: "", imageNotes: "" });
          setChoiceFeedback(choiceId, `已新增：「${text}」。`);
          savePlannerMemory();
          render(currentModel());
          return;
        }

        const editCustomButton = event.target.closest("[data-edit-custom]");
        if (editCustomButton) {
          const choiceId = editCustomButton.dataset.editCustom;
          const index = Number(editCustomButton.dataset.custom);
          const rows = [...(state.customRowsByChoice.get(choiceId) || [])];
          if (rows[index]) rows[index] = { ...rows[index], editing: !rows[index].editing };
          state.customRowsByChoice.set(choiceId, rows);
          state.selectedChoiceId = choiceId;
          savePlannerMemory();
          render(currentModel());
          return;
        }

        const removeCustomButton = event.target.closest("[data-remove-custom]");
        if (removeCustomButton) {
          const choiceId = removeCustomButton.dataset.removeCustom;
          const index = Number(removeCustomButton.dataset.custom);
          const rows = [...(state.customRowsByChoice.get(choiceId) || [])];
          const removed = rows.splice(index, 1)[0];
          state.customRowsByChoice.set(choiceId, rows);
          state.selectedChoiceId = choiceId;
          setChoiceFeedback(choiceId, removed?.text ? `已移除：「${removed.text}」。` : "已移除一句。");
          savePlannerMemory();
          render(currentModel());
          return;
        }

        if (event.target.id === "copyBtn" || event.target.closest("[data-copy-request]")) {
          const error = requestReadinessError();
          if (error) {
            $("statusLine").textContent = error;
            return;
          }
          const copied = await copyText($("requestOutput").value);
          $("statusLine").textContent = copied ? "已複製 JSON，請貼到 Codex 對話。" : "瀏覽器沒有允許剪貼簿。請長按文字框，手動全選複製。";
          return;
        }

        if (event.target.id === "submitBtn" || event.target.closest("[data-submit-request]")) {
          const model = currentModel();
          const error = requestReadinessError();
          if (error) {
            $("statusLine").textContent = error;
            return;
          }
          const message = codexMessage(model);
          const copied = await copyText(message);
          if (navigator.share) {
            try {
              await navigator.share({ title: `${model.lessonId} lesson request`, text: message });
              $("statusLine").textContent = copied
                ? "已叫出分享面板，也已複製內容。請分享到 Codex 或貼回對話；看到 JSON 出現在對話裡才算送到。"
                : "已叫出分享面板。若分享目標沒有 Codex，請手動複製下方文字框內容；看到 JSON 出現在對話裡才算送到。";
              return;
            } catch {
              // The share panel can be canceled; the clipboard copy above is still useful.
            }
          }
          $("statusLine").textContent = copied ? "已複製可貼給 Codex 的完整內容。請回到 Codex 對話貼上；看到 JSON 出現在對話裡才算送到。" : "瀏覽器沒有允許自動複製。請長按下方文字框，手動全選複製後貼回 Codex；看到 JSON 出現在對話裡才算送到。";
          return;
        }

        if (event.target.id === "downloadBtn" || event.target.closest("[data-download-request]")) {
          const model = currentModel();
          const error = requestReadinessError();
          if (error) {
            $("statusLine").textContent = error;
            return;
          }
          const blob = new Blob([$("requestOutput").value + "\n"], { type: "application/json" });
          const link = document.createElement("a");
          link.href = URL.createObjectURL(blob);
          link.download = `${model.lessonId}.json`;
          link.click();
          URL.revokeObjectURL(link.href);
          $("statusLine").textContent = "已下載 JSON。";
          return;
        }

        if (event.target.id === "clearDraftBtn") {
          clearPlannerMemory();
          render(currentModel());
          $("statusLine").textContent = "已清除本課保留的草稿。";
          return;
        }

        if (event.target.id === "refreshBtn") {
          await loadData();
          $("statusLine").textContent = "已重新讀取資料。";
        }
      });

      document.addEventListener("change", (event) => {
        if (event.target.matches("[data-choice][data-index]")) {
          const choiceId = event.target.dataset.choice;
          const index = Number(event.target.dataset.index);
          const set = state.selectedIndexes.get(choiceId) || new Set();
          if (event.target.checked) set.add(index);
          else set.delete(index);
          state.selectedIndexes.set(choiceId, set);
          state.selectedChoiceId = choiceId;
          savePlannerMemory();
          updateOutput(currentModel());
        }
      });

      document.addEventListener("input", (event) => {
        if (event.target.id === "manualChar" || event.target.id === "manualZhuyin" || event.target.id === "manualWhy") {
          state.manualDraft = {
            char: $("manualChar").value,
            zhuyin: $("manualZhuyin").value,
            why: $("manualWhy").value,
          };
          savePlannerMemory();
          return;
        }

        if (event.target.matches("[data-custom-choice][data-custom][data-field]")) {
          const choiceId = event.target.dataset.customChoice;
          const index = Number(event.target.dataset.custom);
          const field = event.target.dataset.field;
          const rows = state.customRowsByChoice.get(choiceId) || [];
          if (!rows[index]) rows[index] = { text: "", spokenText: "", focusChar: "", imageNotes: "" };
          rows[index][field] = event.target.value;
          state.customRowsByChoice.set(choiceId, rows);
          state.selectedChoiceId = choiceId;
          savePlannerMemory();
          updateOutput(currentModel());
        }
        if (event.target.matches("[data-candidate-edit-choice][data-index][data-field]")) {
          const choiceId = event.target.dataset.candidateEditChoice;
          const index = Number(event.target.dataset.index);
          const field = event.target.dataset.field;
          const model = currentModel();
          const choice = choiceById(choiceId);
          const key = sentenceKey(choiceId, index);
          const original = choice?.sentenceCandidates[index];
          const edit = state.candidateEditsBySentence.get(key) || {
            text: String(original?.text || ""),
            spokenText: String(original?.spokenText || original?.text || ""),
            focusChar: String(original?.focusChar || ""),
          };
          edit[field] = event.target.value;
          state.candidateEditsBySentence.set(key, edit);
          state.selectedChoiceId = choiceId;
          const editedSentence = choice ? candidateSentence(choice, index) : null;
          const row = event.target.closest(".sentence-row");
          if (editedSentence && row) {
            const textNode = row.querySelector(".sentence-text");
            const pills = row.querySelectorAll(".sentence-meta .pill");
            if (textNode) textNode.textContent = editedSentence.text;
            if (pills[0]) pills[0].textContent = `spoken: ${editedSentence.spokenText}`;
            if (pills[1]) pills[1].textContent = `focus: ${editedSentence.focusChar}`;
          }
          savePlannerMemory(model);
          updateOutput(model);
        }
        if (event.target.matches("[data-draft-choice][data-field]")) {
          const choiceId = event.target.dataset.draftChoice;
          const field = event.target.dataset.field;
          const draft = draftForChoice(choiceId);
          draft[field] = event.target.value;
          state.customDraftsByChoice.set(choiceId, draft);
          state.selectedChoiceId = choiceId;
          setChoiceFeedback(choiceId, "");
          savePlannerMemory();
          updateOutput(currentModel());
        }
        if (event.target.matches("[data-image-note-choice][data-index]")) {
          const choiceId = event.target.dataset.imageNoteChoice;
          const index = Number(event.target.dataset.index);
          state.imageNotesBySentence.set(sentenceKey(choiceId, index), event.target.value);
          state.selectedChoiceId = choiceId;
          savePlannerMemory();
          updateOutput(currentModel());
        }
      });

      loadData().catch((error) => {
        $("summaryPanel").innerHTML = `<p class="help">${error.message}</p>`;
      });
    </script>
  </body>
</html>
