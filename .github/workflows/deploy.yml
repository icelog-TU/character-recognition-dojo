name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit curriculum state
        run: npm run curriculum:audit-state

      - name: Validate curriculum
        run: npm run validate:curriculum

      - name: Validate production assets
        run: npm run validate:production

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Publish to gh-pages branch
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          touch dist/.nojekyll
          git -C dist init -b gh-pages
          git -C dist config user.name "github-actions[bot]"
          git -C dist config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C dist add -A
          git -C dist commit -m "Deploy ${GITHUB_SHA}"
          git -C dist push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
